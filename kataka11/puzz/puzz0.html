<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Пазлы — Катакана</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    .puzz-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 колонки на ПК */
      gap: 14px;
      margin: 20px 0;
    }
    
    .puzz-grid .btn-neon {
      width: 100%;
      font-size: 14px;
      padding: 12px 10px;
      text-align: center;
      white-space: normal; /* перенос текста */
      line-height: 1.3;
    }
    
    .level-label {
      display: block;
      font-size: 11px;
      opacity: 0.7;
      margin-top: 3px;
      font-weight: 400;
    }

    /* ===== ТЕЛЕФОНЫ: 2 колонки ===== */
    @media (max-width: 600px) {
      .puzz-grid {
        grid-template-columns: 1fr 1fr; /* 2 колонки */
        gap: 10px;
      }
      .puzz-grid .btn-neon {
        font-size: 13px;
        padding: 10px 8px;
      }
      .level-label {
        font-size: 10px;
      }
    }

    /* ===== МАЛЕНЬКИЕ ТЕЛЕФОНЫ: тоже 2 колонки, но меньше ===== */
    @media (max-width: 400px) {
      .puzz-grid {
        gap: 8px;
      }
      .puzz-grid .btn-neon {
        font-size: 12px;
        padding: 8px 6px;
      }
      .level-label {
        font-size: 9px;
      }
    }

    /* ===== САМЫЕ МАЛЕНЬКИЕ: 2 колонки с минимальными отступами ===== */
    @media (max-width: 340px) {
      .puzz-grid {
        gap: 6px;
      }
      .puzz-grid .btn-neon {
        font-size: 11px;
        padding: 6px 4px;
        border-width: 1.5px;
      }
      .level-label {
        font-size: 8px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="glass-card" style="text-align: center;">

    <h2 style="font-size: 2rem; margin-bottom: 5px;">🧩 Пятнашки</h2>
    <p style="color: var(--text-secondary); margin-bottom: 15px;">Собери картинку со знаком каткана</p>

    <div class="theme-picker">
      <button class="theme-btn active" data-theme="cosmic" onclick="setTheme('cosmic')">🌌</button>
      <button class="theme-btn" data-theme="pastel" onclick="setTheme('pastel')">🌸</button>
      <button class="theme-btn" data-theme="blue" onclick="setTheme('blue')">💎</button>
    </div>

    <div class="puzz-grid">
      <a href="puzz1.html" class="btn-neon">あ行・か行 <span class="level-label">Уровень 1</span></a>
      <a href="puzz2.html" class="btn-neon">さ行・た行 <span class="level-label">Уровень 2</span></a>
      <a href="puzz3.html" class="btn-neon">な行・は行 <span class="level-label">Уровень 3</span></a>
      <a href="puzz4.html" class="btn-neon">ま行・ら行 <span class="level-label">Уровень 4</span></a>
      <a href="puzz5.html" class="btn-neon">や行・わ行 <span class="level-label">Уровень 5</span></a>
    </div>

    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="../index.html" class="btn-neon">🏠 В начало</a>
      <button class="btn-neon" onclick="share2()">📤 Поделиться</button>
    </div>

  </div>
</div>

<script src="../App.js"></script>
</body>
</html>
