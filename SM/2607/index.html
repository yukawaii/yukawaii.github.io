<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Уютные лапки</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="./js/12.js"></script>

</head>
<body>
    <div id="game-wrapper" class="no-scroll">
        <canvas id="board-canvas"></canvas>

        <!-- LOADING -->
        <div id="scene-loading" class="scene active">
            <div class="loader">
                <div class="loader-spinner"></div>
                <div class="loader-text" data-lkey="loading">Загрузка...</div>
                <div class="loader-progress"><div class="loader-progress-bar" id="load-progress"></div></div>
            </div>
        </div>

        <!-- MENU -->
        <div id="scene-menu" class="scene">
            <div class="menu-content">
                <div class="menu-title" data-lkey="menu_title">🍜 Уютные<br>Лапки</div>
                <div class="menu-subtitle" data-lkey="menu_sub">~ Кафе Котёнка ~</div>
                <div class="menu-score" id="menu-score-display">⭐ 0</div>
                <button class="menu-btn" id="menu-play-btn" data-lkey="menu_play">Играть</button>
                <div class="menu-lang-row">
                    <button class="lang-btn active" data-lang="ru">🇷🇺 RU</button>
                    <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
                    <button class="lang-btn" data-lang="tr">🇹🇷 TR</button>
                </div>
                <button class="menu-btn menu-btn-secondary" id="menu-reset-btn" data-lkey="menu_reset">Сброс</button>
                <div class="menu-footer" data-lkey="menu_footer">© 2026 · Версия 0.1</div>
            </div>
        </div>

        <!-- DIALOGUE -->
        <div id="scene-dialogue" class="scene">
            <div class="dialogue-container">
                <div class="dialogue-avatar">🐱</div>
                <div class="dialogue-speaker" data-lkey="dialogue_speaker">Котёнок</div>
                <div class="dialogue-text" id="dialogue-text">...</div>
                <button class="dialogue-continue" id="dialogue-continue-btn" data-lkey="dialogue_continue">Продолжить</button>
            </div>
        </div>

        <!-- GAME -->
        <div id="scene-game" class="scene">
            <div class="game-topbar">
                <div class="tb-left">
                    <div class="tb-item"><span class="tb-icon">⭐</span><span class="tb-value" id="game-score">0</span></div>
                    <div class="tb-item"><span class="tb-icon">🏆</span><span class="tb-value" id="game-level">1</span></div>
                </div>
                <div class="tb-right">
                    <div class="tb-item"><span class="tb-icon">⏱</span><span class="tb-value" id="game-timer">120</span><span>s</span></div>
                    <button class="tb-btn" id="game-pause-btn">⏸</button>
                    <button class="tb-btn" id="game-home-btn">🏠</button>
                </div>
            </div>
            <div id="game-board-container">
                <div id="game-board">
                    <canvas id="game-canvas"></canvas>
                    <div class="game-overlay" id="overlay-pause">
                        <div class="overlay-title" data-lkey="pause_title">⏸ Пауза</div>
                        <div class="overlay-text" data-lkey="pause_text">Игра приостановлена</div>
                        <button class="overlay-btn" id="overlay-resume-btn" data-lkey="pause_resume">Продолжить</button>
                    </div>
                    <div class="game-overlay" id="overlay-gameover">
                        <div class="overlay-title" data-lkey="gameover_title">🎉 Уровень пройден!</div>
                        <div class="overlay-text" data-lkey="gameover_text">Отличная работа!</div>
                        <button class="overlay-btn" id="overlay-next-btn" data-lkey="gameover_next">Следующий</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключаем модули -->
    <script src="js/localization.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Запуск после загрузки всех скриптов
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof App !== 'undefined') App.init();
        });
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (typeof App !== 'undefined' && !App.initialized) App.init();
        }
    </script>
</body>
</html>
