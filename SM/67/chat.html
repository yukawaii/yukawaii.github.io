<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ВсёТут — AI Чат</title>
    <!-- Подключаем React, ReactDOM и библиотеку -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@benbassatido/ai-chatbot@0.1.4/dist/index.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@benbassatido/ai-chatbot@0.1.4/dist/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            font-family: "Geneva", "Verdana", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .window {
            background: white;
            border: 2px solid black;
            box-shadow: 8px 8px 0 black;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .title-bar {
            background: white;
            border-bottom: 2px solid black;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .close-box {
            background: white;
            border: 2px solid black;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
        }
        .close-box:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        #chatbot-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body>
<div class="window">
    <div class="title-bar">
        <span>🤖 AI Чат (DeepSeek)</span>
        <div class="close-box" onclick="window.location.href='index.html'">✕</div>
    </div>
    <div id="chatbot-container"></div>
</div>

<script>
    // Ждём загрузки React и компонента
    document.addEventListener('DOMContentLoaded', function() {
        if (window.AiChatbot && window.React && window.ReactDOM) {
            window.ReactDOM.render(
                window.React.createElement(window.AiChatbot.Chatbot, {
                    title: "DeepSeek Чат",
                    brandColor: "#000000",
                    welcomeMessage: "Привет! Я DeepSeek. Спрашивай что угодно!",
                    systemPrompt: "Ты DeepSeek — полезный AI-ассистент. Отвечай кратко и по делу, на русском языке.",
                    direction: "ltr",
                    storageMode: "localStorage",
                    businessInfo: {
                        companyName: "ВсёТут",
                        description: "Игры, обучение, инструменты"
                    }
                }),
                document.getElementById('chatbot-container')
            );
        } else {
            document.getElementById('chatbot-container').innerHTML = '<div style="padding:20px; text-align:center;">Загрузка чата...</div>';
        }
    });
</script>
</body>
</html>
