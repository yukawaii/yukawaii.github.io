<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ВсёТут — AI Чат</title>
    <style>
        * { user-select: none; box-sizing: border-box; }
        body {
            margin: 0; padding: 20px; height: 100vh; overflow: hidden;
            background-color: #e5e5e5; font-family: "Geneva", "Verdana", sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .window {
            background: white; border: 2px solid black; box-shadow: 8px 8px 0 black;
            width: 100%; max-width: 800px; height: 90vh; display: flex; flex-direction: column;
        }
        .title-bar {
            background: white; border-bottom: 2px solid black; padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .close-box {
            background: white; border: 2px solid black; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 2px 2px 0 black;
        }
        .close-box:active { transform: translate(1px, 1px); box-shadow: none; }
        .chat-area {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .message {
            max-width: 80%; padding: 10px 15px; border: 2px solid black; word-wrap: break-word;
        }
        .user { background: black; color: white; align-self: flex-end; }
        .ai { background: white; color: black; align-self: flex-start; }
        .input-area {
            border-top: 2px solid black; padding: 10px; display: flex; gap: 10px; background: #eee;
        }
        textarea {
            flex: 1; border: 2px solid black; padding: 10px; font-family: inherit;
            font-size: 1rem; resize: none; height: 60px;
        }
        button {
            background: white; border: 2px solid black; padding: 0 20px;
            font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 black;
        }
        button:active { transform: translate(1px, 1px); box-shadow: none; }
        
        /* Выпадающий список моделей */
        .model-selector {
            padding: 8px 12px;
            border-bottom: 2px solid black;
            background: #f5f5f5;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.8rem;
        }
        .model-selector select {
            border: 2px solid black;
            padding: 4px 8px;
            font-family: inherit;
            background: white;
        }
    </style>
    <!-- Подключаем Puter.js — бесплатный доступ ко всем AI моделям -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div class="window">
    <div class="title-bar">
        <span>🤖 AI Чат (безлимитный)</span>
        <div class="close-box" onclick="window.location.href='index.html'">✕</div>
    </div>
    <div class="model-selector">
        <span>Модель:</span>
        <select id="model-select">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o-mini</option>
            <option value="o3-mini">O3-mini</option>
            <option value="o1-mini">O1-mini</option>
            <option value="claude-sonnet-4">Claude Sonnet 4</option>
            <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="meta-llama/llama-4-maverick">Llama 4 Maverick</option>
            <option value="mistralai/mistral-large">Mistral Large</option>
        </select>
    </div>
    <div class="chat-area" id="chat-area">
        <div class="message ai">Привет! Я AI-ассистент. Спрашивай что угодно — безлимитно и бесплатно!</div>
    </div>
    <div class="input-area">
        <textarea id="user-input" placeholder="Напишите сообщение..."></textarea>
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chat-area');
    const userInput = document.getElementById('user-input');
    const modelSelect = document.getElementById('model-select');
    
    // Сохраняем историю диалога
    let messages = [];
    
    // Загружаем историю из localStorage
    try {
        const saved = localStorage.getItem('puter_chat_history');
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.length > 0) {
                messages = parsed;
                chatArea.innerHTML = '';
                messages.forEach(msg => {
                    if (msg.role === 'user') addMessage(msg.content, 'user');
                    if (msg.role === 'assistant') addMessage(msg.content, 'ai');
                });
            }
        }
    } catch(e) {}
    
    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        
        addMessage(text, 'user');
        userInput.value = '';
        
        messages.push({ role: "user", content: text });
        
        // Ограничиваем историю последними 20 сообщениями
        while (messages.length > 20) messages.shift();
        
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai';
        loadingDiv.innerText = '...';
        chatArea.appendChild(loadingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        try {
            // Выбранная модель
            const model = modelSelect.value;
            
            // Отправляем запрос через Puter.js (без ключей, без ограничений!)
            const response = await puter.ai.chat(
                messages.map(m => m.content).join('\n\n'),
                { model: model }
            );
            
            loadingDiv.remove();
            addMessage(response, 'ai');
            
            messages.push({ role: "assistant", content: response });
            localStorage.setItem('puter_chat_history', JSON.stringify(messages));
            
        } catch (error) {
            console.error("Error:", error);
            loadingDiv.innerText = `⚠️ Ошибка: ${error.message}. Попробуйте другой модель или позже.`;
        }
    }
    
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
