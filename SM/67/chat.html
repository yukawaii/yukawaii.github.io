<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ВсёТут — DeepSeek Чат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            font-family: "Geneva", "Verdana", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .window {
            background: white;
            border: 2px solid black;
            box-shadow: 8px 8px 0 black;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .title-bar {
            background: white;
            border-bottom: 2px solid black;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .close-box {
            background: white;
            border: 2px solid black;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
        }
        .close-box:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        .iframe-container {
            flex: 1;
            background: white;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<div class="window">
    <div class="title-bar">
        <span>🐋 DeepSeek Чат</span>
        <div class="close-box" onclick="window.location.href='index.html'">✕</div>
    </div>
<iframe src="https://chat.deepseek.com/?mobile=true" style="width:100%; height:100%; border:none;"></iframe>
    </div>
</div>
</body>
</html>
