<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ВсёТут — Dropbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            height: 100vh; overflow: hidden; background-color: #e5e5e5;
            font-family: "Geneva", "Verdana", sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .window {
            background: white; border: 2px solid black; box-shadow: 8px 8px 0 black;
            width: 100%; max-width: 800px; height: 90vh; display: flex; flex-direction: column;
        }
        .title-bar {
            background: white; border-bottom: 2px solid black; padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .close-box {
            background: white; border: 2px solid black; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 2px 2px 0 black;
        }
        .close-box:active { transform: translate(1px, 1px); box-shadow: none; }
        .toolbar {
            padding: 8px; border-bottom: 2px solid black; background: #eee;
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .breadcrumb { flex: 1; font-size: 0.85rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
        .icon-btn {
            background: white; border: 2px solid black; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 2px 2px 0 black; font-size: 1rem;
        }
        .icon-btn:active { transform: translate(1px, 1px); box-shadow: none; background: black; color: white; }
        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .sys-btn {
            background: white; border: 2px solid black; padding: 6px 12px;
            font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 black;
        }
        .sys-btn:active { transform: translate(1px, 1px); box-shadow: none; background: black; color: white; }
        .login-view {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;
        }
        .file-list {
            flex: 1; overflow-y: auto; background: white;
        }
        .list-header {
            display: flex; background: #ccc; border-bottom: 1px solid black;
            font-size: 0.75rem; font-weight: bold; position: sticky; top: 0;
        }
        .header-col { padding: 4px 8px; }
        .col-name { flex: 2; min-width: 150px; }
        .col-date { width: 140px; }
        .col-size { width: 70px; text-align: right; }
        .file-item {
            display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee;
            cursor: pointer; font-size: 0.85rem;
        }
        .file-item:hover { background: #e0e0ff; }
        .file-cell { padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-bar {
            border-top: 2px solid black; padding: 4px; font-size: 0.75rem;
            background: #eee; text-align: center;
        }
        .loading { padding: 40px; text-align: center; color: #666; }
        .empty-state { padding: 40px; text-align: center; color: #999; font-style: italic; }
        .error-state { padding: 40px; text-align: center; color: red; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10000;
        }
        .modal-content {
            background: white; border: 2px solid black; box-shadow: 8px 8px 0 black;
            max-width: 90%; max-height: 85%; overflow: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; padding: 10px;
            border-bottom: 2px solid black; background: #eee; font-weight: bold;
        }
        .modal-body { padding: 20px; }
        .modal-body img { max-width: 100%; }
        .modal-body pre { white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
<div class="window">
    <div class="title-bar">
        <span>📦 Dropbox</span>
        <div class="close-box" onclick="window.location.href='index.html'">✕</div>
    </div>

    <div id="login-view" class="login-view">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <h2>Dropbox</h2>
        <p style="margin: 16px 0;">Войдите в свой аккаунт Dropbox, чтобы просматривать файлы.</p>
        <button id="login-btn" class="sys-btn" onclick="login()">🔐 Войти через Dropbox</button>
    </div>

    <div id="main-view" style="display: none; flex-direction: column; flex: 1;">
        <div class="toolbar">
            <button class="icon-btn" id="back-btn" onclick="goBack()" disabled="">←</button>
            <button class="icon-btn" onclick="refreshFolder()">↻</button>
            <div id="breadcrumb" class="breadcrumb"></div>
            <button class="icon-btn" id="logout-btn" onclick="logout()" style="margin-left: auto;">🚪</button>
        </div>
        <div id="loading-view" class="loading">Загрузка...</div>
        <div id="file-list" class="file-list" style="display: none;"></div>
        <div id="empty-view" class="empty-state" style="display: none;">Папка пуста</div>
        <div id="error-view" class="error-state" style="display: none;">Ошибка загрузки</div>
    </div>

    <div class="status-bar" id="status-bar">Не подключено</div>
</div>

<!-- Preview Modal -->
<div id="preview-modal" class="modal-overlay" onclick="closePreview(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="preview-title">Просмотр</span>
            <button class="icon-btn" onclick="closePreview()">X</button>
        </div>
        <div class="modal-body" id="preview-body"></div>
        <div style="padding: 10px; border-top: 2px solid black; text-align: right;">
            <button class="sys-btn" id="preview-download-btn">Скачать</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dropbox@10.34.0/dist/Dropbox-sdk.min.js"></script>
<script>
    // ========== НАСТРОЙКИ ==========
    // Зарегистрируй приложение на https://www.dropbox.com/developers/apps
    // Redirect URI: https://yukawaii.github.io/SM/67/dropbox.html
    const DROPBOX_APP_KEY = 'i4h4u74yl1do8wo';  // ← твой ключ
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    // ========== СОСТОЯНИЕ ==========
    let dbx = null;
    let accessToken = null;
    let currentPath = '';
    let pathHistory = [];

    // ========== ФУНКЦИИ ==========
    function showStatus(msg) {
        const el = document.getElementById('status-bar');
        if (el) el.textContent = msg;
    }

    function showLogin() {
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('main-view').style.display = 'none';
        showStatus('Не подключено');
    }

    function showMain() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'flex';
    }

    function setLoading(show) {
        document.getElementById('loading-view').style.display = show ? 'block' : 'none';
        document.getElementById('file-list').style.display = show ? 'none' : 'block';
        document.getElementById('empty-view').style.display = 'none';
        document.getElementById('error-view').style.display = 'none';
    }

    function showError(msg) {
        document.getElementById('error-view').style.display = 'block';
        document.getElementById('error-view').innerHTML = msg + '<br><button class="sys-btn" style="margin-top:10px;" onclick="refreshFolder()">Повторить</button>';
        document.getElementById('file-list').style.display = 'none';
        document.getElementById('empty-view').style.display = 'none';
        document.getElementById('loading-view').style.display = 'none';
    }

    // ========== OAuth ==========
    function generateCodeVerifier() {
        const array = new Uint8Array(32);
        crypto.getRandomValues(array);
        return btoa(String.fromCharCode.apply(null, array)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function generateCodeChallenge(verifier) {
        const encoder = new TextEncoder();
        const data = encoder.encode(verifier);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode.apply(null, new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function login() {
        const verifier = generateCodeVerifier();
        localStorage.setItem('dropbox_verifier', verifier);
        const challenge = await generateCodeChallenge(verifier);
        const authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${DROPBOX_APP_KEY}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&code_challenge=${challenge}&code_challenge_method=S256&token_access_type=offline`;
        window.location.href = authUrl;
    }

    async function handleAuthCallback(code) {
        const verifier = localStorage.getItem('dropbox_verifier');
        if (!verifier) return;

        const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                code: code,
                grant_type: 'authorization_code',
                client_id: DROPBOX_APP_KEY,
                redirect_uri: REDIRECT_URI,
                code_verifier: verifier
            })
        });

        const data = await response.json();
        if (data.access_token) {
            accessToken = data.access_token;
            localStorage.setItem('dropbox_token', accessToken);
            if (data.refresh_token) localStorage.setItem('dropbox_refresh', data.refresh_token);
            localStorage.removeItem('dropbox_verifier');
            initDropbox(accessToken);
            window.history.replaceState({}, document.title, window.location.pathname);
            await loadFolder('');
            showMain();
            showStatus('Подключено');
        } else {
            showLogin();
            showStatus('Ошибка входа');
        }
    }

    async function refreshAccessToken() {
        const refresh = localStorage.getItem('dropbox_refresh');
        if (!refresh) return false;
        try {
            const response = await fetch('https://api.dropboxapi.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'refresh_token',
                    refresh_token: refresh,
                    client_id: DROPBOX_APP_KEY
                })
            });
            const data = await response.json();
            if (data.access_token) {
                accessToken = data.access_token;
                localStorage.setItem('dropbox_token', accessToken);
                initDropbox(accessToken);
                return true;
            }
        } catch(e) {}
        return false;
    }

    function initDropbox(token) {
        dbx = new Dropbox.Dropbox({ accessToken: token });
    }

    function logout() {
        localStorage.removeItem('dropbox_token');
        localStorage.removeItem('dropbox_refresh');
        accessToken = null;
        dbx = null;
        currentPath = '';
        pathHistory = [];
        showLogin();
    }

    // ========== РАБОТА С ФАЙЛАМИ ==========
    async function loadFolder(path) {
        if (!dbx) return;
        currentPath = path || '';
        setLoading(true);
        updateBreadcrumb();
        try {
            const response = await dbx.filesListFolder({ path: currentPath });
            const entries = response.result.entries;
            if (entries.length === 0) {
                document.getElementById('empty-view').style.display = 'block';
                document.getElementById('file-list').style.display = 'none';
            } else {
                document.getElementById('empty-view').style.display = 'none';
                renderFileList(entries);
                document.getElementById('file-list').style.display = 'block';
            }
            document.getElementById('back-btn').disabled = pathHistory.length === 0;
            setLoading(false);
        } catch (error) {
            if (error.status === 401) {
                const ok = await refreshAccessToken();
                if (ok) {
                    await loadFolder(currentPath);
                    return;
                } else {
                    logout();
                }
            }
            setLoading(false);
            showError('Ошибка загрузки: ' + (error.error?.error_summary || error.message));
        }
    }

    function renderFileList(entries) {
        const container = document.getElementById('file-list');
        container.innerHTML = '';

        const header = document.createElement('div');
        header.className = 'list-header';
        header.innerHTML = `<div class="header-col col-name">Имя</div><div class="header-col col-date">Дата</div><div class="header-col col-size">Размер</div>`;
        container.appendChild(header);

        entries.sort((a,b) => {
            if (a['.tag'] === 'folder' && b['.tag'] !== 'folder') return -1;
            if (a['.tag'] !== 'folder' && b['.tag'] === 'folder') return 1;
            return a.name.localeCompare(b.name);
        });

        for (const entry of entries) {
            const isFolder = entry['.tag'] === 'folder';
            const icon = isFolder ? '📁' : getFileIcon(entry.name);
            const size = isFolder ? '—' : formatSize(entry.size);
            const date = entry.client_modified ? new Date(entry.client_modified).toLocaleDateString() : '—';

            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <div class="file-cell col-name">${icon} ${escapeHtml(entry.name)}</div>
                <div class="file-cell col-date">${date}</div>
                <div class="file-cell col-size">${size}</div>
            `;
            div.onclick = () => {
                if (isFolder) {
                    pathHistory.push(currentPath);
                    loadFolder(entry.path_lower);
                } else {
                    previewFile(entry);
                }
            };
            container.appendChild(div);
        }
    }

    async function previewFile(entry) {
        const ext = entry.name.split('.').pop().toLowerCase();
        const isImage = ['jpg','jpeg','png','gif','bmp','webp'].includes(ext);
        const isText = ['txt','md','json','xml','html','css','js'].includes(ext);

        document.getElementById('preview-title').innerText = entry.name;
        const previewBody = document.getElementById('preview-body');
        const downloadBtn = document.getElementById('preview-download-btn');
        downloadBtn.onclick = () => downloadFile(entry.path_lower, entry.name);

        if (isImage) {
            try {
                const link = await dbx.filesGetTemporaryLink({ path: entry.path_lower });
                previewBody.innerHTML = `<img src="${link.result.link}" style="max-width:100%;">`;
                document.getElementById('preview-modal').style.display = 'flex';
            } catch(e) {
                previewBody.innerHTML = '<p>Не удалось загрузить изображение</p>';
                document.getElementById('preview-modal').style.display = 'flex';
            }
        } else if (isText) {
            try {
                const response = await dbx.filesDownload({ path: entry.path_lower });
                const text = await response.result.fileBlob.text();
                previewBody.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
                document.getElementById('preview-modal').style.display = 'flex';
            } catch(e) {
                previewBody.innerHTML = '<p>Не удалось прочитать файл</p>';
                document.getElementById('preview-modal').style.display = 'flex';
            }
        } else {
            previewBody.innerHTML = '<p>Предпросмотр недоступен. Нажмите "Скачать" чтобы получить файл.</p>';
            document.getElementById('preview-modal').style.display = 'flex';
        }
    }

    async function downloadFile(path, name) {
        try {
            const link = await dbx.filesGetTemporaryLink({ path: path });
            const a = document.createElement('a');
            a.href = link.result.link;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch(e) {
            alert('Ошибка скачивания');
        }
    }

    function goBack() {
        if (pathHistory.length > 0) {
            const prev = pathHistory.pop();
            loadFolder(prev);
        }
    }

    function refreshFolder() {
        loadFolder(currentPath);
    }

    function updateBreadcrumb() {
        const container = document.getElementById('breadcrumb');
        if (!currentPath) {
            container.innerHTML = '<span>📁 Корень</span>';
            return;
        }
        const parts = currentPath.split('/').filter(p => p);
        let html = '<span onclick="loadFolder(\'\')">📁 Корень</span>';
        let path = '';
        for (const part of parts) {
            path += '/' + part;
            html += ` / <span onclick="loadFolder('${path}')">${escapeHtml(part)}</span>`;
        }
        container.innerHTML = html;
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','webp'].includes(ext)) return '🖼️';
        if (['mp3','wav','flac'].includes(ext)) return '🎵';
        if (['mp4','avi','mkv'].includes(ext)) return '🎬';
        if (['zip','rar','7z','tar','gz'].includes(ext)) return '📦';
        if (['pdf'].includes(ext)) return '📄';
        if (['doc','docx'].includes(ext)) return '📝';
        return '📄';
    }

    function formatSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
        return (bytes/(1024*1024)).toFixed(1) + ' MB';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function closePreview(e) {
        if (!e || e.target.id === 'preview-modal') {
            document.getElementById('preview-modal').style.display = 'none';
        }
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
            handleAuthCallback(code);
            return;
        }
        const savedToken = localStorage.getItem('dropbox_token');
        if (savedToken) {
            accessToken = savedToken;
            initDropbox(accessToken);
            loadFolder('').then(() => {
                showMain();
                showStatus('Подключено');
            }).catch(() => {
                showLogin();
            });
        } else {
            showLogin();
        }
    };
</script>
</body>
</html>
