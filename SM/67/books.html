<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Books</title>
    <style>
        /* Все твои старые стили остаются без изменений */
        /* (я не трогаю стили, просто копирую их из твоего файла) */
        
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        body {
            font-family: "Geneva", "Verdana", sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-sizing: border-box;
        }

        * {
            transition: none !important;
            animation: none !important;
        }

        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 0 10px;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px; bottom: 4px; left: 4px; right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            z-index: 1;
            font-size: 1.1rem;
        }

        .close-box {
            position: absolute;
            left: 10px; width: 18px; height: 18px;
            border: 2px solid black; background: white;
            z-index: 2; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem;
            box-shadow: 2px 2px 0 black;
        }

        .close-box:active {
            background: black; color: white; transform: translate(1px, 1px); box-shadow: none;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid black;
            background: #eee;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1; padding: 10px; text-align: center; border-right: 1px solid black;
            background: #eee; cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }

        .tab-btn:last-child { border-right: none; }

        .tab-btn.active {
            background: white; border-bottom: 2px solid white; margin-bottom: -2px; z-index: 10;
        }

        .window-content {
            flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; background: white;
        }

        #saved-view {
            display: flex; flex-direction: column; height: 100%;
            overflow-y: auto;
        }

        #log-view {
            display: none; flex-direction: column; height: 100%; overflow-y: auto;
        }

        .period-controls {
            display: flex; justify-content: space-between; align-items: center; padding: 10px;
            border-bottom: 2px solid black; background: #eee; flex-shrink: 0;
        }
        .period-display { font-weight: bold; font-size: 1rem; text-transform: uppercase; }
        .nav-btn {
            background: white; border: 2px solid black; padding: 5px 15px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 black;
        }
        .nav-btn:active { background: black; color: white; box-shadow: none; transform: translate(1px, 1px); }
        .day-row { display: flex; border-bottom: 1px solid #ccc; flex: 1; min-height: 50px; align-items: stretch; }
        .day-label {
            width: 60px; background: #fafafa; border-right: 2px solid black; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .day-num { font-weight: bold; font-size: 1.1rem; }
        .day-name { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .day-row.today .day-label { background: black; color: white; }
        .slots-container { flex-grow: 1; display: flex; align-items: center; padding: 5px; gap: 5px; overflow-x: auto; }
        .slot {
            flex: 1; min-width: 40px; height: 80%; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; cursor: pointer;
        }
        .slot.filled { background: black; color: white; }
        .total-display {
            width: 70px; display: flex; align-items: center; justify-content: center; font-weight: bold;
            border-left: 1px solid #ccc; background: #f9f9f9;
        }

        .sys-btn {
            background: white; border: 2px solid black; padding: 8px 15px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0 black;
        }
        .sys-btn:active { background: black; color: white; transform: translate(2px, 2px); box-shadow: none; }

        .upload-area {
            border: 2px dashed black;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin: 15px;
            background: #f9f9f9;
        }
        .upload-area:active { background: black; color: white; }

        .local-book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            margin: 5px 15px;
            cursor: pointer;
        }
        .local-book-item:active { background: black; color: white; }
        .delete-book {
            background: white;
            border: 1px solid black;
            padding: 4px 8px;
            cursor: pointer;
        }

        /* MODAL READER */
        #book-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .book-view-box {
            background: white;
            border: 2px solid black;
            box-shadow: 8px 8px 0 black;
            width: 95%;
            height: 95%;
            display: flex;
            flex-direction: column;
        }
        .book-modal-footer {
            border-top: 2px solid black;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eee;
            flex-shrink: 0;
        }
        #book-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: Georgia, serif;
            line-height: 1.6;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .page-controls {
            display: flex;
            gap: 10px;
        }
    </style>
    <script src="time.js"></script>
    <script src="theme.js?v=18"></script>
    <script src="js/i18n.js"></script>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <div class="close-box" onclick="window.location.href='/index'">X</div>
            <span class="title-text">Books</span>
        </div>

        <div class="tabs">
            <div class="tab-btn active" id="tab-saved" onclick="switchTab('saved')">📖 My Books</div>
            <div class="tab-btn" id="tab-log" onclick="switchTab('log')">📊 Reading Log</div>
        </div>

        <div class="window-content">
            <div id="saved-view">
                <div class="upload-area" onclick="document.getElementById('txt-input').click()">
                    📂 Нажми, чтобы выбрать книгу (.txt) с телефона или компьютера
                </div>
                <input type="file" id="txt-input" accept=".txt" style="display:none">
                <button class="sys-btn" onclick="clearAllBooks()" style="margin-left:15px;">🗑️ Удалить все книги</button>
                <div id="books-list"></div>
            </div>

            <div id="log-view">
                <div class="period-controls">
                    <button class="nav-btn" onclick="changeWeek(-1)">&lt;</button>
                    <span class="period-display" id="current-period-label">...</span>
                    <button class="nav-btn" onclick="changeWeek(1)">&gt;</button>
                </div>
                <div class="log-container" id="reading-log-list"></div>
            </div>
        </div>
    </div>

    <!-- MODAL ДЛЯ ЧТЕНИЯ КНИГИ -->
    <div id="book-modal">
        <div class="book-view-box">
            <div class="title-bar">
                <div class="title-stripes"></div>
                <div class="close-box" onclick="closeBookModal()">X</div>
                <span class="title-text" id="book-title">Reading</span>
            </div>
            <div id="book-content"></div>
            <div class="book-modal-footer">
                <button class="sys-btn" onclick="prevBookPage()">◀ Previous</button>
                <span id="book-page-indicator">Page 1 of 1</span>
                <button class="sys-btn" onclick="nextBookPage()">Next ▶</button>
            </div>
        </div>
    </div>

    <script>
        // ========= КНИГИ (ТОЛЬКО .TXT) =========
        let books = [];
        let currentBookText = '';
        let currentBookName = '';
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 3000; // символов на страницу

        function loadBooks() {
            const saved = localStorage.getItem('local_books_txt');
            if (saved) books = JSON.parse(saved);
            renderBooksList();
        }

        function renderBooksList() {
            const container = document.getElementById('books-list');
            if (!container) return;
            container.innerHTML = '';
            if (books.length === 0) {
                container.innerHTML = '<div style="padding:15px; color:#666;">📭 Нет книг. Загрузите .txt файл.</div>';
                return;
            }
            books.forEach((book, index) => {
                const div = document.createElement('div');
                div.className = 'local-book-item';
                div.innerHTML = `
                    <span style="flex:1;">📘 ${escapeHtml(book.name)}</span>
                    <button class="delete-book" data-index="${index}">✕</button>
                `;
                div.querySelector('span').onclick = () => openBookModal(book.text, book.name);
                div.querySelector('.delete-book').onclick = (e) => {
                    e.stopPropagation();
                    books.splice(index, 1);
                    saveBooks();
                    renderBooksList();
                };
                container.appendChild(div);
            });
        }

        function saveBooks() {
            localStorage.setItem('local_books_txt', JSON.stringify(books));
        }

        document.getElementById('txt-input')?.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file && file.name.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    books.push({
                        name: file.name,
                        text: e.target.result
                    });
                    saveBooks();
                    renderBooksList();
                };
                reader.readAsText(file, 'UTF-8');
            } else {
                alert('Пожалуйста, выберите файл в формате .txt');
            }
            event.target.value = '';
        });

        function clearAllBooks() {
            if (confirm('Удалить все сохранённые книги?')) {
                books = [];
                saveBooks();
                renderBooksList();
            }
        }

function escapeHtml(str) {
    if (!str) return '';
    // Экранируем HTML-символы
    let escaped = str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
    
    // Нормализуем переносы строк:
    // 1. Сначала заменяем все \r\n на \n
    // 2. Заменяем 3 и более \n подряд на 2 \n
    // 3. Заменяем оставшиеся \n на <br>
    escaped = escaped.replace(/\r\n/g, '\n')
                     .replace(/\n{3,}/g, '\n')
                     .replace(/\n/g, '<br>');
    
    return escaped;
}
        // ========= ЧТЕНИЕ КНИГИ В МОДАЛЬНОМ ОКНЕ =========
        function openBookModal(text, fileName) {
            currentBookText = text;
            currentBookName = fileName.replace('.txt', '');
            document.getElementById('book-title').innerText = currentBookName;
            
            // Рассчитываем страницы
            totalPages = Math.ceil(currentBookText.length / pageSize);
            currentPage = 1;
            
            updateBookContent();
            
            document.getElementById('book-modal').style.display = 'flex';
        }
        
        function updateBookContent() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            let pageText = currentBookText.substring(start, end);
            if (pageText.length === 0 && currentPage > 1) {
                currentPage = totalPages;
                updateBookContent();
                return;
            }
            const contentDiv = document.getElementById('book-content');
            contentDiv.innerHTML = `<div style="font-family: Georgia, serif; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(pageText)}</div>`;
            document.getElementById('book-page-indicator').innerText = `Page ${currentPage} of ${totalPages}`;
        }
        
        function prevBookPage() {
            if (currentPage > 1) {
                currentPage--;
                updateBookContent();
            }
        }
        
        function nextBookPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updateBookContent();
            }
        }
        
        function closeBookModal() {
            document.getElementById('book-modal').style.display = 'none';
            currentBookText = '';
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('book-modal');
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowLeft') prevBookPage();
                if (e.key === 'ArrowRight') nextBookPage();
            }
        });

        // ========= ЛОГИКА ВТОРОЙ ВКЛАДКИ =========
        let readingData = {};
        let currentStart = new Date();
        let today = new Date();
        const INTERVALS = [15, 30, 45, 60, 75, 90, 105, 120];
        
        function initCurrentWeek() {
            const day = currentStart.getDay();
            const diff = currentStart.getDate() - day + (day === 0 ? -6 : 1);
            currentStart = new Date(currentStart);
            currentStart.setDate(diff);
        }

        function loadLocalDataLog() {
            const saved = localStorage.getItem('reading_log_data');
            if (saved) readingData = JSON.parse(saved);
            if (currentView === 'log') renderLogView();
        }

        function saveLogData(dateKey, minutes) {
            if (minutes === 0) delete readingData[dateKey];
            else readingData[dateKey] = minutes;
            localStorage.setItem('reading_log_data', JSON.stringify(readingData));
            renderLogView();
        }

        function changeWeek(delta) {
            currentStart.setDate(currentStart.getDate() + (delta * 7));
            renderLogView();
        }

        function renderLogView() {
            const container = document.getElementById('reading-log-list');
            if (!container) return;
            container.innerHTML = '';
            const weekEnd = new Date(currentStart);
            weekEnd.setDate(currentStart.getDate() + 6);
            
            const startStr = currentStart.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            const endStr = weekEnd.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            document.getElementById('current-period-label').innerText = `${startStr} — ${endStr}`;
            
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(currentStart);
                dateObj.setDate(currentStart.getDate() + i);
                const y = dateObj.getFullYear();
                const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                const d = String(dateObj.getDate()).padStart(2, '0');
                const dateKey = `${y}-${m}-${d}`;
                const dayNum = dateObj.getDate();
                const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });
                const currentMinutes = readingData[dateKey] || 0;
                const isToday = (dateObj.toDateString() === today.toDateString());
                
                const row = document.createElement('div');
                row.className = `day-row ${isToday ? 'today' : ''}`;
                row.innerHTML = `<div class="day-label"><span class="day-num">${dayNum}</span><span class="day-name">${dayName}</span></div>`;
                
                const slotsContainer = document.createElement('div');
                slotsContainer.className = 'slots-container';
                INTERVALS.forEach(val => {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    if (currentMinutes >= val) slot.classList.add('filled');
                    let labelText = val === 60 ? '1h' : (val === 120 ? '2h+' : val + 'm');
                    slot.innerText = labelText;
                    slot.onclick = () => { saveLogData(dateKey, (currentMinutes === val) ? 0 : val); };
                    slotsContainer.appendChild(slot);
                });
                row.appendChild(slotsContainer);
                
                const total = document.createElement('div');
                total.className = 'total-display';
                total.innerText = currentMinutes > 0 ? (currentMinutes === 120 ? '2h+' : currentMinutes + 'm') : '-';
                row.appendChild(total);
                container.appendChild(row);
            }
        }

        // ========= ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =========
        let currentView = 'saved';
        
        function switchTab(tab) {
            currentView = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            const savedView = document.getElementById('saved-view');
            const logView = document.getElementById('log-view');
            
            if (tab === 'saved') {
                savedView.style.display = 'flex';
                logView.style.display = 'none';
                loadBooks();
            } else {
                savedView.style.display = 'none';
                logView.style.display = 'flex';
                renderLogView();
            }
        }
        
        // ========= ИНИЦИАЛИЗАЦИЯ =========
        function init() {
            initCurrentWeek();
            loadLocalDataLog();
            loadBooks();
            switchTab('saved');
        }
        
        init();
    </script>
</body>
</html>
