<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Наши Игры</title>
    <link href='https://fonts.googleapis.com/css?family=Arvo:400,700' rel='stylesheet' type='text/css'>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <style>
/* Общие настройки адаптивного фона */
body {
    background: url(./background.jpg) no-repeat center center fixed;     
    background-size: cover;
    margin: 0;
    padding: 0;
    font-family: 'Arvo', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
} 

/* Главный контейнер-обертка */
.container {
    width: 100%;
    max-width: 900px;
    padding: 40px 20px;
    box-sizing: border-box;
    text-align: center;
}

/* Яркий заголовок с тенью для идеальной читаемости */
h1 {
    color: #1e293b;
    font-size: clamp(26px, 5vw, 36px);
    margin-bottom: 35px;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
}

/* Умная адаптивная сетка для карточек игр */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 45px;
}

/* Новые контрастные кнопки-карточки (Цвет ВК) */
.game-card {
    /* Плотный синий градиент, который не просвечивает светлый фон */
    background: linear-gradient(135deg, #468ee5 0%, #2f76c4 100%);
    border: 1px solid #2561a4;
    border-radius: 14px;
    padding: 22px 18px;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff; /* Белый контрастный текст */
    cursor: pointer;
    /* Глубокая тень для объема */
    box-shadow: 0 4px 15px rgba(37, 97, 164, 0.2);
    transition: all 0.2s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 55px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

/* Эффект при наведении (кнопка становится ярче и "подсвечивается") */
.game-card:hover {
    transform: translateY(-4px); /* Мягкое приподнятие */
    background: linear-gradient(135deg, #519bf7 0%, #378de5 100%);
    box-shadow: 0 10px 25px rgba(55, 141, 229, 0.45);
    border-color: #519bf7;
}

/* Эффект при клике */
.game-card:active {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(37, 97, 164, 0.3);
}

/* Кнопка «В начало» — нейтральная и заметная */
.back-button {
    background: #64748b; /* Мягкий графитовый цвет */
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
    transition: all 0.2s ease;
    display: inline-block;
}

.back-button:hover {
    background: #475569;
    transform: scale(1.02);
    box-shadow: 0 6px 18px rgba(100, 116, 139, 0.4);
}

.back-button:active {
    transform: scale(0.98);
}

    </style>
</head>
<body>

    <div class="container">
        <!-- Тот самый заголовок, который вы просили -->
        <h1>Каталог наших игр</h1>
        
        <!-- Сетка карточек (все брейки <br> удалены, CSS Grid выравнивает всё сам) -->
        <div class="games-grid">
            <div class="game-card" onclick="window.open('https://m.vk.ru/app51397074');">Весёлая акула</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/tetrisc');">Весёлый тетрис</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/hitrixx');">Весёлая радуга</div>
            
            <div class="game-card" onclick="window.open('https://m.vk.ru/crosstheroad');">Весёлая цыпа на дороге</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app51399437');">Фруктовая корзина</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/amebae');">Амёба: эволюция</div>

            <div class="game-card" onclick="window.open('https://m.vk.ru/katakana_jp');">Японский язык: катакана</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/hiragana_jp');">Японский язык: хирагана</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app8181888');">Японский язык: Н1-Н5</div>

            <div class="game-card" onclick="window.open('https://vk.ru/app8177204');">Угадай животное!</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/animepuzz');">Аниме-пазлы</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app8178502');">Реакция</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app8176436');">Весёлая мошка</div>
        </div>
        
        <!-- Стильная кнопка возврата -->
        <button class="back-button" onclick="window.location.href = './index.html';">В начало</button>
    </div>

</body>
</html>
