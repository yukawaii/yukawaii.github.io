<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Наши Игры — компактный каталог</title>
    <link href='https://fonts.googleapis.com/css?family=Arvo:400,700' rel='stylesheet' type='text/css'>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <style>
/* ----- ОБЩИЕ СБРОСЫ И ФОН (без изменений, сохранена атмосфера) ----- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: url(./background.jpg) no-repeat center center fixed;     
    background-size: cover;
    margin: 0;
    padding: 0;
    font-family: 'Arvo', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
} 

/* Главный контейнер-обертка (чуть уменьшил внутренние отступы для компактности) */
.container {
    width: 100%;
    max-width: 960px;
    padding: 28px 20px 40px 20px;
    box-sizing: border-box;
    text-align: center;
}

/* Заголовок — оставили выразительным */
h1 {
    color: #1e293b;
    font-size: clamp(24px, 5vw, 34px);
    margin-bottom: 28px;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
}

/* ---------- УМЕНЬШЕННЫЕ КАРТОЧКИ-КНОПКИ (КОМПАКТНАЯ СЕТКА) ---------- */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* минимальная ширина 200px вместо 240px — сетка плотнее */
    gap: 14px;          /* уменьшили расстояние между карточками с 20px до 14px */
    margin-bottom: 38px;
}

/* КЛЮЧЕВОЕ: уменьшенные кнопки — меньший паддинг, меньший шрифт, но сохраняем стиль ВК */
.game-card {
    /* Яркий градиент (ВК-стиль) */
    background: linear-gradient(135deg, #468ee5 0%, #2f76c4 100%);
    border: 1px solid #2561a4;
    border-radius: 12px;      /* чуть меньше скругление (было 14px) */
    padding: 12px 10px;       /* РАНЬШЕ БЫЛО 22px 18px — сильное уменьшение по вертикали и горизонтали */
    font-size: 14px;          /* уменьшили шрифт с 16px -> 14px, текст более изящный */
    font-weight: bold;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(37, 97, 164, 0.2); /* слегка уменьшили тень */
    transition: all 0.2s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 48px;          /* фиксируем минимальную высоту для ровного вида, но карточки стали ниже */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    word-break: break-word;    /* красивые переносы длинных названий */
    line-height: 1.3;
}

/* Эффект при наведении — плавное поднятие (оставили, но слегка уменьшили трансформацию) */
.game-card:hover {
    transform: translateY(-3px); /* было -4px, чуть мягче */
    background: linear-gradient(135deg, #519bf7 0%, #378de5 100%);
    box-shadow: 0 8px 18px rgba(55, 141, 229, 0.4);
    border-color: #519bf7;
}

.game-card:active {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(37, 97, 164, 0.3);
}

/* Кнопка «В начало» — тоже можно чуть уменьшить, чтобы гармонировала с общим стилем */
.back-button {
    background: #64748b;
    color: #ffffff;
    border: none;
    border-radius: 40px;       /* более округлая, но стильная */
    padding: 10px 32px;        /* ранее было 14px 40px — уменьшили отступы */
    font-size: 15px;           /* чуть меньше 16px -> 15px */
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(100, 116, 139, 0.3);
    transition: all 0.2s ease;
    display: inline-block;
    letter-spacing: 0.3px;
}

.back-button:hover {
    background: #475569;
    transform: scale(1.02);
    box-shadow: 0 5px 14px rgba(100, 116, 139, 0.4);
}

.back-button:active {
    transform: scale(0.97);
}

/* Дополнительный микро-адаптив: на совсем маленьких экранах (ширина < 460px) 
   делаем карточки еще чуть компактнее, чтобы сетка не была слишком громоздкой */
@media (max-width: 480px) {
    .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
    }
    .game-card {
        padding: 10px 6px;
        font-size: 13px;
        min-height: 44px;
        border-radius: 10px;
    }
    .container {
        padding: 20px 14px 32px 14px;
    }
    h1 {
        margin-bottom: 22px;
        font-size: 26px;
    }
    .back-button {
        padding: 8px 24px;
        font-size: 14px;
    }
}

/* Для очень узких телефонов (320px) — справится ещё плотнее */
@media (max-width: 360px) {
    .games-grid {
        grid-template-columns: 1fr;  /* одна колонка, но кнопки становятся шире, но по высоте компактны */
        gap: 10px;
    }
    .game-card {
        padding: 10px 12px;
        font-size: 13px;
        min-height: 46px;
    }
}
    </style>
</head>
<body>

    <div class="container">
        <!-- Заголовок (тот же самый, яркий) -->
        <h1>Каталог наших игр</h1>
        
        <!-- Сетка карточек — все кнопки стали визуально компактнее (меньше паддинг, шрифт 14px, меньше расстояние) -->
        <div class="games-grid">
            <div class="game-card" onclick="window.open('https://m.vk.ru/app51397074');">Весёлая акула</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/tetrisc');">Весёлый тетрис</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/hitrixx');">Весёлая радуга</div>
            
            <div class="game-card" onclick="window.open('https://m.vk.ru/crosstheroad');">Весёлая цыпа на дороге</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app51399437');">Фруктовая корзина</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/amebae');">Амёба: эволюция</div>

            <div class="game-card" onclick="window.open('https://m.vk.ru/katakana_jp');">Японский язык: катакана</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/hiragana_jp');">Японский язык: хирагана</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app8181888');">Японский язык: Н1-Н5</div>

            <div class="game-card" onclick="window.open('https://vk.ru/app8177204');">Угадай животное!</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/animepuzz');">Аниме-пазлы</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app8178502');">Реакция</div>
            <div class="game-card" onclick="window.open('https://m.vk.ru/app8176436');">Весёлая мошка</div>
        </div>
        
        <!-- Кнопка возврата — тоже обновлена, размер уменьшен и стиль гармонирует -->
        <button class="back-button" onclick="window.location.href = './index.html';">В начало</button>
    </div>

    <!-- (опционально) легкий скрипт для интеграции VK Bridge — оставлен без изменений на случай будущих фич 
         (хотя в данной демке он не обязателен, но сохранён для совместимости по вашему запросу) -->
    <script>
        // Инициализация VK Bridge для полноценной работы внутри VK (если страница запущена в webview VK)
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit', {})
                .then(data => { /* успешная инициализация */ })
                .catch(error => console.error('VK Bridge init error:', error));
        }
        
        // Дополнительная микро-фича: лёгкая аналитика или обработка (без вмешательства в интерфейс)
        // Просто для демонстрации "знание API" – оповещение в консоль не мешает, но и не влияет на размер кнопок.
        console.log('Компактный каталог игр загружен | Кнопки уменьшены для удобного просмотра');
    </script>
</body>
</html>
