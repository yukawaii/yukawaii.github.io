        .grid {

        .cell {
    width: 62px;
    height: 62px;
    background: #fffdf5;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    font-family: 'Segoe UI', 'Montserrat', monospace;
    color: #2b4a1e;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.05s linear;
    box-shadow: 0 4px 0 #9b6e42;
    border: 2px solid #ffefc0;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.05);
}

.cell.selected {
    background: #f7b32b;
    /* Убираем transform: translateY(3px); - оно двигает клетку */
    color: #2f2a1a;
    border-color: #ffe0a3;
    box-shadow: 0 2px 0 #8b5a2a;
}

.cell.found {
    background: linear-gradient(145deg, #6b9c3f, #3d7620);
    color: white;
    text-shadow: 0 1px 2px black;
    border-color: #c2e082;
    opacity: 0.85;
    /* Убираем transform: translateY(2px); */
    box-shadow: 0 2px 0 #235b10;
}

.cell:active {    transform: scale(0.97);}   
        .cell.wrong-flash {
            background: #e06c6c;
            box-shadow: 0 2px 0 #973c3c;
            animation: shakeAnim 0.2s ease-in-out 0s 2;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .words-container {
            background: #ede1ca;
            border-radius: 38px;
            padding: 12px 18px;

   function playTapSound() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.08; // тише (было 0.12)
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
        osc.stop(audioCtx.currentTime + 0.1);
    } catch(e) {}
}
    
function playSuccessSound() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const now = audioCtx.currentTime;
        
        // Мажорный аккорд: До-Ми-Соль (C-E-G)
        const notes = [523.25, 659.25, 783.99]; // До, Ми, Соль
        
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.value = 0.15;
            
            // Каждая нота со сдвигом по времени
            const startTime = now + index * 0.1;
            osc.start(startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.4);
            osc.stop(startTime + 0.4);
        });
        
        // Добавляем верхнюю ноту для радости (Си)
        const oscHigh = audioCtx.createOscillator();
        const gainHigh = audioCtx.createGain();
        oscHigh.connect(gainHigh);
        gainHigh.connect(audioCtx.destination);
        oscHigh.type = 'sine';
        oscHigh.frequency.value = 987.77; // Си
        gainHigh.gain.value = 0.12;
        oscHigh.start(now + 0.2);
        gainHigh.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
        oscHigh.stop(now + 0.6);
        
    } catch(e) { console.log("Звук не поддерживается"); }
}

// Размещение слова с чередованием направлений и возможностью пересечений
let lastDirectionWasHorizontal = true; // запоминаем последнее направление

function tryPlaceWord(word, tempGrid, usedSet, gridSizeVal, preferredDirection) {
    const maxAttempts = 400;
    
    // preferredDirection: 'H' или 'V' или null (случайно)
    let directions = [];
    if (preferredDirection === 'H') directions = ['H', 'V'];
    else if (preferredDirection === 'V') directions = ['H', 'V'];
    else directions = ['H', 'V'];
    
    for (let dirAttempt = 0; dirAttempt < directions.length; dirAttempt++) {
        const horizontal = (directions[dirAttempt] === 'H');
        
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            let row, col;
            
            if (horizontal) {
                row = Math.floor(Math.random() * gridSizeVal);
                col = Math.floor(Math.random() * (gridSizeVal - word.length + 1));
            } else {
                row = Math.floor(Math.random() * (gridSizeVal - word.length + 1));
                col = Math.floor(Math.random() * gridSizeVal);
            }
            
            let conflict = false;
            const coords = [];
            
            for (let i = 0; i < word.length; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;
                const existingLetter = tempGrid[r][c];
                
                if (existingLetter !== null && existingLetter !== word[i]) {
                    conflict = true;
                    break;
                }
                
                coords.push([r, c]);
            }
            
            if (!conflict) {
                // Размещаем слово
                for (let i = 0; i < word.length; i++) {
                    const r = horizontal ? row : row + i;
                    const c = horizontal ? col + i : col;
                    if (tempGrid[r][c] === null) {
                        tempGrid[r][c] = word[i];
                        usedSet.add(`${r},${c}`);
                    }
                }
                return { coords, direction: horizontal ? 'H' : 'V' };
            }
        }
    }
    return null;
}
    
// Размещение Г-образного слова (часть по горизонтали, часть по вертикали)
function tryPlaceLShapeWord(word, tempGrid, gridSizeVal, existingWordsPositions, wordIndex) {
    const maxAttempts = 400;
    const minBend = 2;
    const maxBend = word.length - 2;
    
    if (maxBend < minBend) return null;
    
    for (let bendPos = minBend; bendPos <= maxBend; bendPos++) {
        const firstPart = bendPos;
        
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            const variants = [
                { hDir: 1, vDir: 1, hFirst: true },
                { hDir: 1, vDir: -1, hFirst: true },
                { hDir: -1, vDir: 1, hFirst: true },
                { hDir: -1, vDir: -1, hFirst: true },
                { hDir: 1, vDir: 1, hFirst: false },
                { hDir: 1, vDir: -1, hFirst: false },
                { hDir: -1, vDir: 1, hFirst: false },
                { hDir: -1, vDir: -1, hFirst: false }
            ];
            
            for (let v of variants) {
                let canPlace = true;
                const coords = [];
                
                if (v.hFirst) {
                    // Горизонтальная часть
                    const hStartRow = Math.floor(Math.random() * gridSizeVal);
                    const hStartCol = Math.floor(Math.random() * (gridSizeVal - firstPart + 1));
                    
                    for (let i = 0; i < firstPart; i++) {
                        const r = hStartRow;
                        const c = hStartCol + i * v.hDir;
                        if (c < 0 || c >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                    if (!canPlace) continue;
                    
                    // Вертикальная часть
                    const lastR = coords[coords.length - 1][0];
                    const lastC = coords[coords.length - 1][1];
                    for (let i = firstPart; i < word.length; i++) {
                        const r = lastR + (i - firstPart + 1) * v.vDir;
                        const c = lastC;
                        if (r < 0 || r >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                } else {
                    // Вертикальная часть
                    const vStartRow = Math.floor(Math.random() * (gridSizeVal - firstPart + 1));
                    const vStartCol = Math.floor(Math.random() * gridSizeVal);
                    
                    for (let i = 0; i < firstPart; i++) {
                        const r = vStartRow + i * v.vDir;
                        const c = vStartCol;
                        if (r < 0 || r >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                    if (!canPlace) continue;
                    
                    // Горизонтальная часть
                    const lastR = coords[coords.length - 1][0];
                    const lastC = coords[coords.length - 1][1];
                    for (let i = firstPart; i < word.length; i++) {
                        const r = lastR;
                        const c = lastC + (i - firstPart + 1) * v.hDir;
                        if (c < 0 || c >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                }
                
                if (canPlace && coords.length === word.length) {
                    for (let i = 0; i < coords.length; i++) {
                        const [r, c] = coords[i];
                        if (tempGrid[r][c] === null) {
                            tempGrid[r][c] = word[i];
                        }
                    }
                    return { coords, direction: 'L' };
                }
            }
        }
    }
    return null;
}

function generateLevel(themeIndex, customWords, retryCount = 0, difficulty = 'easy') {
    const MAX_RETRIES = 15;
    const theme = LEVELS_DATA[themeIndex % LEVELS_DATA.length];
    const gridSizeVal = theme.size;
    const isHardMode = difficulty === 'medium';
    let wordsToPlace = [...customWords];
    
    wordsToPlace.sort((a,b) => b.length - a.length);
    
    let tempGrid = Array(gridSizeVal).fill().map(() => Array(gridSizeVal).fill(null));
    let positions = new Map();
    let allPlaced = true;
    
   for (let i = 0; i < wordsToPlace.length; i++) {
    const word = wordsToPlace[i];
    let result = null;
    
    if (isHardMode && word.length >= 4) {
        result = tryPlaceLShapeWord(word, tempGrid, gridSizeVal, positions, i);
    }
    
    if (!result) {
        result = tryPlaceWordWithIntersections(word, tempGrid, gridSizeVal, positions, i, wordsToPlace.length);
    }
    
    if (result) {
        positions.set(word, result);
    } else {
        allPlaced = false;
        break;
    }
}
    // Если не все слова разместились, пробуем снова
    if (!allPlaced && retryCount < MAX_RETRIES) {
        return generateLevel(themeIndex, customWords, retryCount + 1);
    }
    
    // Принудительное размещение
    if (!allPlaced) {
        for (let i = 0; i < wordsToPlace.length; i++) {
            const word = wordsToPlace[i];
            if (!positions.has(word)) {
                let forced = false;
                for (let r = 0; r < gridSizeVal && !forced; r++) {
                    for (let c = 0; c <= gridSizeVal - word.length; c++) {
                        let can = true;
                        for (let k = 0; k < word.length; k++) {
                            if (tempGrid[r][c+k] !== null && tempGrid[r][c+k] !== word[k]) {
                                can = false;
                                break;
                            }
                        }
                        if (can) {
                            for (let k = 0; k < word.length; k++) {
                                if (tempGrid[r][c+k] === null) tempGrid[r][c+k] = word[k];
                            }
                            positions.set(word, { coords: Array.from({length: word.length}, (_,k) => [r, c+k]), direction: 'H' });
                            forced = true;
                            break;
                        }
                    }
                }
                if (!forced) {
                    for (let c = 0; c < gridSizeVal && !forced; c++) {
                        for (let r = 0; r <= gridSizeVal - word.length; r++) {
                            let can = true;
                            for (let k = 0; k < word.length; k++) {
                                if (tempGrid[r+k][c] !== null && tempGrid[r+k][c] !== word[k]) {
                                    can = false;
                                    break;
                                }
                            }
                            if (can) {
                                for (let k = 0; k < word.length; k++) {
                                    if (tempGrid[r+k][c] === null) tempGrid[r+k][c] = word[k];
                                }
                                positions.set(word, { coords: Array.from({length: word.length}, (_,k) => [r+k, c]), direction: 'V' });
                                forced = true;
                                break;
                            }
                        }
                    }
                }
            }
        }
    }
    
    // Заполняем пустые клетки
    for (let i = 0; i < gridSizeVal; i++) {
        for (let j = 0; j < gridSizeVal; j++) {
            if (tempGrid[i][j] === null) {
                tempGrid[i][j] = RUS_LETTERS[Math.floor(Math.random() * RUS_LETTERS.length)];
            }
        }
    }
    
    // ФИНАЛЬНАЯ ПРОВЕРКА: все ли слова на месте
    for (let word of wordsToPlace) {
        if (!positions.has(word)) {
            console.error(`❌ Слово "${word}" не разместилось! Перегенерация...`);
            if (retryCount < MAX_RETRIES) {
                return generateLevel(themeIndex, customWords, retryCount + 1);
            }
        }
    }
    
    console.log(`✅ Уровень создан: ${wordsToPlace.length} слов размещено`);
    return { grid: tempGrid, size: gridSizeVal, words: wordsToPlace, positions };
}

// Размещение слова с поиском пересечений
function tryPlaceWordWithIntersections(word, tempGrid, gridSizeVal, existingWordsPositions, wordIndex, totalWords) {
    const maxAttempts = 1500; // было 800, увеличил для надёжности
    
    const preferHorizontal = (wordIndex % 2 === 0);
    
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const tryHorizontal = preferHorizontal ? [true, false] : [false, true];
        
        for (let isHorizontal of tryHorizontal) {
            let maxRow = isHorizontal ? gridSizeVal : gridSizeVal - word.length + 1;
            let maxCol = isHorizontal ? gridSizeVal - word.length + 1 : gridSizeVal;
            
            if (maxRow <= 0 || maxCol <= 0) continue;
            
            const row = Math.floor(Math.random() * maxRow);
            const col = Math.floor(Math.random() * maxCol);
            
            let conflict = false;
            const coords = [];
            let hasIntersection = false;
            
            for (let i = 0; i < word.length; i++) {
                const r = isHorizontal ? row : row + i;
                const c = isHorizontal ? col + i : col;
                const existingLetter = tempGrid[r][c];
                
                if (existingLetter !== null && existingLetter !== word[i]) {
                    conflict = true;
                    break;
                }
                if (existingLetter === word[i]) {
                    hasIntersection = true;
                }
                coords.push([r, c]);
            }
            
            if (!conflict) {
                // Для первых слов не требуем пересечений, для остальных - желательно
                if (wordIndex >= 2 && !hasIntersection && existingWordsPositions.size > 0) {
                    const willRetry = attempt < maxAttempts - 200;
                    if (willRetry) continue;
                }
                
                for (let i = 0; i < word.length; i++) {
                    const r = isHorizontal ? row : row + i;
                    const c = isHorizontal ? col + i : col;
                    if (tempGrid[r][c] === null) {
                        tempGrid[r][c] = word[i];
                    }
                }
                return { coords, direction: isHorizontal ? 'H' : 'V' };
            }
        }
    }
    return null;
}

  // Проверка для Г-образных слов (средняя сложность)
function checkLShapeOrder(chain, correctCoords) {
    if (chain.length !== correctCoords.length) return false;
    
    // Для каждой позиции проверяем, что координаты совпадают
    // ИЛИ (если позиция крайняя) что это правильная буква на соседней клетке
    for (let i = 0; i < chain.length; i++) {
        const expectedRow = correctCoords[i][0];
        const expectedCol = correctCoords[i][1];
        const actualRow = chain[i].row;
        const actualCol = chain[i].col;
        
        // Если координаты совпадают — отлично
        if (actualRow === expectedRow && actualCol === expectedCol) {
            continue;
        }
        
        // Если это первая или последняя буква, проверяем альтернативную клетку
        const isFirstOrLast = (i === 0 || i === chain.length - 1);
        if (isFirstOrLast) {
            // Проверяем, что это соседняя клетка с той же буквой
            const expectedLetter = grid[expectedRow][expectedCol];
            const actualLetter = grid[actualRow][actualCol];
            
            if (expectedLetter !== actualLetter) return false;
            
            // Проверяем, что это одна из соседних клеток
            const isAdjacent = (Math.abs(actualRow - expectedRow) + Math.abs(actualCol - expectedCol)) <= 1;
            if (!isAdjacent) return false;
            
            // Проверяем, что эта клетка не занята другим словом
            if (isCellFound(actualRow, actualCol)) return false;
            
            // Проверяем, что эта клетка ещё не использована в цепочке
            const alreadyUsed = chain.some((c, idx) => idx !== i && c.row === actualRow && c.col === actualCol);
            if (alreadyUsed) return false;
        } else {
            // Для внутренних букв — строгое совпадение
            return false;
        }
    }
    return true;
}

   // Функция для запуска конфетти
function showConfetti() {
    const duration = 3000; // 3 секунды
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000, colors: ['#FFD700', '#FFA54D', '#6B9C3F', '#FF6B6B', '#4ECDC4'] };

    function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
            return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        
        // Конфетти с двух сторон
        confetti({
            ...defaults,
            particleCount: Math.floor(particleCount),
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        });
        confetti({
            ...defaults,
            particleCount: Math.floor(particleCount),
            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        });
    }, 250);
}

function getGalaxyStars() {

    difficulties.forEach(diff => {
        const completedLevels = getCompletedLevels(diff);
        CATEGORIES.forEach(cat => {
            const categoryLevels = getLevelsByCategory(cat.id);
            let completedCount = 0;

                if (completedLevels.includes(levelId)) {
                    completedCount++;
                }
            });
            const key = `${cat.id}_${diff}`;
            stars[key] = {
                categoryId: cat.id,
                difficulty: diff,
                totalStars: completedCount * 5,
                maxStars: categoryLevels.length * 5,
                completedLevels: completedCount,
                totalLevels: categoryLevels.length
            };
        });
    });
    return stars;
}

    }

// Функция для получения общего количества звёзд
function getTotalStars() {
    // Если totalStars = 0, но в localStorage есть значение — используем его
    if (totalStars === 0) {
        const saved = localStorage.getItem('totalStars');
        if (saved) {
            totalStars = parseInt(saved);
        }
    }
    return totalStars;
}

// Создаём живые звёзды на фоне
function createLivingStars() {
    const starCount = 80;
    const container = document.body;
    
    // Цвета для звёзд
    const colors = [
        'rgba(255, 255, 255, 1)',

}
// Получить количество открытых свитков
function getUnlockedScrolls() {
    const saved = localStorage.getItem('unlockedScrolls');
    return saved ? JSON.parse(saved) : [];
}

// Открыть свиток
function unlockScroll(scrollId) {
    const unlocked = getUnlockedScrolls();
    if (!unlocked.includes(scrollId)) {
        unlocked.push(scrollId);
        localStorage.setItem('unlockedScrolls', JSON.stringify(unlocked));
    }
}

// Проверить, открыт ли свиток
function isScrollUnlocked(scrollId) {
    return getUnlockedScrolls().includes(scrollId);
}

// Рассчитать, сколько свитков должно быть открыто по звёздам
function calculateUnlockedScrolls() {
    const stars = totalStars || parseInt(localStorage.getItem('totalStars') || 0);
    return Math.min(Math.floor(stars / 100), WISDOM_SCROLLS.length);
}

// Синхронизировать открытые свитки со звёздами
function syncScrollsWithStars() {
    const shouldBeUnlocked = calculateUnlockedScrolls();
    const unlocked = getUnlockedScrolls();
    
    // Открываем все свитки до нужного номера
    for (let i = 1; i <= shouldBeUnlocked; i++) {
        if (!unlocked.includes(i)) {
            unlockScroll(i);
        }
    }
    return shouldBeUnlocked;
}

let currentScrollPage = 0;
const SCROLLS_PER_PAGE = 10;

function showScrollsModal() {
    // Синхронизируем свитки со звёздами
    syncScrollsWithStars();
    
    const modalDiv = document.createElement('div');
    modalDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:10005;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(5px);';
    
    const contentDiv = document.createElement('div');
    contentDiv.style.cssText = 'background:#fff8ec;border-radius:48px;padding:20px;max-width:450px;width:90%;text-align:center;border:2px solid #ffa54d;max-height:80vh;overflow-y:auto;';
    
    const unlockedCount = getUnlockedScrolls().length;
    const totalStars = parseInt(localStorage.getItem('totalStars') || 0);
    const nextStarThreshold = Math.ceil((unlockedCount + 1) * 100);
    const totalPages = Math.ceil(WISDOM_SCROLLS.length / SCROLLS_PER_PAGE);
    
    if (currentScrollPage >= totalPages) currentScrollPage = totalPages - 1;
    if (currentScrollPage < 0) currentScrollPage = 0;
    
    const startIdx = currentScrollPage * SCROLLS_PER_PAGE;
    const endIdx = Math.min(startIdx + SCROLLS_PER_PAGE, WISDOM_SCROLLS.length);
    const pageScrolls = WISDOM_SCROLLS.slice(startIdx, endIdx);
    
    let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h3 style="color:#2c3e2b;font-size:1.5rem;margin:0;">📜 Свитки мудрости</h3>
            <button id="closeScrollsModal" style="background:transparent;border:none;font-size:1.8rem;cursor:pointer;color:#8b5a2a;padding:0;width:35px;height:35px;display:flex;align-items:center;justify-content:center;">✕</button>
        </div>
        <div style="background:#ede1ca;border-radius:30px;padding:12px;margin-bottom:15px;">
            <span style="font-weight:bold;color:#2c3e2b;">⭐ ${totalStars} звёзд</span>
            <span style="color:#6B5B4E;margin-left:10px;">|</span>
            <span style="color:#6B5B4E;">📜 ${unlockedCount} / ${WISDOM_SCROLLS.length} открыто</span>
            ${unlockedCount < WISDOM_SCROLLS.length ? `<div style="font-size:0.8rem;color:#8b5a2a;margin-top:5px;">🔒 Следующий свиток откроется на ${nextStarThreshold} звёздах</div>` : '<div style="font-size:0.8rem;color:#517a2f;margin-top:5px;">🌟 Все свитки открыты! Ты — хранитель мудрости!</div>'}
        </div>
        <div style="text-align:left;max-height:350px;overflow-y:auto;padding:5px;">
    `;
    
    pageScrolls.forEach(scroll => {
        const unlocked = isScrollUnlocked(scroll.id);
        html += `
            <div class="scroll-item" data-id="${scroll.id}" style="
                display:flex;
                align-items:center;
                justify-content:space-between;
                padding:10px 15px;
                margin:4px 0;
                background:${unlocked ? '#fff8ec' : '#f0ebe0'};
                border-radius:12px;
                border-left:4px solid ${unlocked ? '#ffa54d' : '#d4c3a4'};
                cursor:${unlocked ? 'pointer' : 'default'};
                transition:0.1s;
            ">
                <div style="display:flex;align-items:center;gap:12px;">
                    <span style="font-size:1.2rem;">${unlocked ? '📜' : '🔒'}</span>
                    <span style="color:#2c3e2b;font-weight:${unlocked ? 'bold' : 'normal'};">Свиток ${scroll.id}</span>
                </div>
                <div>
                    ${unlocked ? '<span style="color:#517a2f;font-size:1rem;">✓</span>' : '<span style="color:#8a7a6a;font-size:0.7rem;">закрыт</span>'}
                </div>
            </div>
        `;
    });
    
    html += `
        </div>
        <div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-top:15px;">
            <button id="scrollPrevPage" style="background:#8b5a2a;color:white;border:none;padding:8px 16px;border-radius:40px;font-size:0.9rem;cursor:pointer;${currentScrollPage === 0 ? 'opacity:0.3;cursor:default;' : ''}">◀ Назад</button>
            <span style="color:#6B5B4E;font-size:0.9rem;">${currentScrollPage + 1} / ${totalPages}</span>
            <button id="scrollNextPage" style="background:#8b5a2a;color:white;border:none;padding:8px 16px;border-radius:40px;font-size:0.9rem;cursor:pointer;${currentScrollPage === totalPages - 1 ? 'opacity:0.3;cursor:default;' : ''}">Вперёд ▶</button>
        </div>
    `;
    
    contentDiv.innerHTML = html;
    modalDiv.appendChild(contentDiv);
    document.body.appendChild(modalDiv);
    
    // Обработчики клика по свиткам
    document.querySelectorAll('.scroll-item').forEach(item => {
        const id = parseInt(item.getAttribute('data-id'));
        const unlocked = isScrollUnlocked(id);
        
        item.onclick = () => {
            if (unlocked) {
                modalDiv.remove();
                showScrollDetail(id);
            }
        };
    });
    
    // Пагинация
    document.getElementById('scrollPrevPage').onclick = () => {
        if (currentScrollPage > 0) {
            currentScrollPage--;
            modalDiv.remove();
            showScrollsModal();
        }
    };
    
    document.getElementById('scrollNextPage').onclick = () => {
        if (currentScrollPage < totalPages - 1) {
            currentScrollPage++;
            modalDiv.remove();
            showScrollsModal();
        }
    };
    
    document.getElementById('closeScrollsModal').onclick = () => modalDiv.remove();
    modalDiv.onclick = (e) => { if (e.target === modalDiv) modalDiv.remove(); };
}
