function findNextLevel(currentLevelId, difficulty) {
    const currentLevel = getLevelById(currentLevelId);
    if (!currentLevel) return ALL_LEVELS[0];
    
    const catId = currentLevel.categoryId;
    const levelNum = currentLevel.levelNum;
    
    // Получаем все уровни этой категории с ТОЙ ЖЕ сложностью
    const categoryLevels = getLevelsByCategoryAndDifficulty(catId, difficulty);
    
    // Ищем следующий номер уровня
    let nextLevelNum = levelNum + 1;
    let nextLevel = categoryLevels.find(l => l.levelNum === nextLevelNum);
    
    if (nextLevel) {
        return nextLevel; // ✅ нашли следующий подуровень
    }
    
    // Уровни в категории закончились — переходим к следующей категории
const allCategories = getCurrentCategories();
const currentCatIndex = allCategories.findIndex(c => c.id === catId);
    let nextCatIndex = (currentCatIndex + 1) % allCategories.length;
    
    let attempts = 0;
    while (attempts < allCategories.length) {
        const nextCat = allCategories[nextCatIndex];
        // ✅ ИСПРАВЛЕНИЕ: передаём difficulty!
        const nextCatLevels = getLevelsByCategoryAndDifficulty(nextCat.id, difficulty);
        
        if (nextCatLevels.length > 0) {
            // Берём первый уровень (levelNum === 1)
            const firstLevel = nextCatLevels.find(l => l.levelNum === 1);
            if (firstLevel) return firstLevel;
            return nextCatLevels[0];
        }
        
        nextCatIndex = (nextCatIndex + 1) % allCategories.length;
        attempts++;
    }
    
    // Если ничего не нашли, возвращаем первый уровень с нужной сложностью
    return ALL_LEVELS.find(l => l.difficulty === difficulty) || ALL_LEVELS[0];
}

let lastDirectionWasHorizontal = true; // запоминаем последнее направление

function tryPlaceWord(word, tempGrid, usedSet, gridSizeVal, preferredDirection) {
    const maxAttempts = 400;
    
    // preferredDirection: 'H' или 'V' или null (случайно)
    let directions = [];
    if (preferredDirection === 'H') directions = ['H', 'V'];
    else if (preferredDirection === 'V') directions = ['H', 'V'];
    else directions = ['H', 'V'];
    
    for (let dirAttempt = 0; dirAttempt < directions.length; dirAttempt++) {
        const horizontal = (directions[dirAttempt] === 'H');
        
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            let row, col;
            
            if (horizontal) {
                row = Math.floor(Math.random() * gridSizeVal);
                col = Math.floor(Math.random() * (gridSizeVal - word.length + 1));
            } else {
                row = Math.floor(Math.random() * (gridSizeVal - word.length + 1));
                col = Math.floor(Math.random() * gridSizeVal);
            }
            
            let conflict = false;
            const coords = [];
            
            for (let i = 0; i < word.length; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;
                const existingLetter = tempGrid[r][c];
                
                if (existingLetter !== null && existingLetter !== word[i]) {
                    conflict = true;
                    break;
                }
                
                coords.push([r, c]);
            }
            
            if (!conflict) {
                // Размещаем слово
                for (let i = 0; i < word.length; i++) {
                    const r = horizontal ? row : row + i;
                    const c = horizontal ? col + i : col;
                    if (tempGrid[r][c] === null) {
                        tempGrid[r][c] = word[i];
                        usedSet.add(`${r},${c}`);
                    }
                }
                return { coords, direction: horizontal ? 'H' : 'V' };
            }
        }
    }
    return null;
}
    
// Размещение Г-образного слова (часть по горизонтали, часть по вертикали)
function tryPlaceLShapeWord(word, tempGrid, gridSizeVal, existingWordsPositions, wordIndex) {
    const maxAttempts = 400;
    const minBend = 2;
    const maxBend = word.length - 2;
    
    if (maxBend < minBend) return null;
    
    for (let bendPos = minBend; bendPos <= maxBend; bendPos++) {
        const firstPart = bendPos;
        
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            const variants = [
                { hDir: 1, vDir: 1, hFirst: true },
                { hDir: 1, vDir: -1, hFirst: true },
                { hDir: -1, vDir: 1, hFirst: true },
                { hDir: -1, vDir: -1, hFirst: true },
                { hDir: 1, vDir: 1, hFirst: false },
                { hDir: 1, vDir: -1, hFirst: false },
                { hDir: -1, vDir: 1, hFirst: false },
                { hDir: -1, vDir: -1, hFirst: false }
            ];
            
            for (let v of variants) {
                let canPlace = true;
                const coords = [];
                
                if (v.hFirst) {
                    // Горизонтальная часть
                    const hStartRow = Math.floor(Math.random() * gridSizeVal);
                    const hStartCol = Math.floor(Math.random() * (gridSizeVal - firstPart + 1));
                    
                    for (let i = 0; i < firstPart; i++) {
                        const r = hStartRow;
                        const c = hStartCol + i * v.hDir;
                        if (c < 0 || c >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                    if (!canPlace) continue;
                    
                    // Вертикальная часть
                    const lastR = coords[coords.length - 1][0];
                    const lastC = coords[coords.length - 1][1];
                    for (let i = firstPart; i < word.length; i++) {
                        const r = lastR + (i - firstPart + 1) * v.vDir;
                        const c = lastC;
                        if (r < 0 || r >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                } else {
                    // Вертикальная часть
                    const vStartRow = Math.floor(Math.random() * (gridSizeVal - firstPart + 1));
                    const vStartCol = Math.floor(Math.random() * gridSizeVal);
                    
                    for (let i = 0; i < firstPart; i++) {
                        const r = vStartRow + i * v.vDir;
                        const c = vStartCol;
                        if (r < 0 || r >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                    if (!canPlace) continue;
                    
                    // Горизонтальная часть
                    const lastR = coords[coords.length - 1][0];
                    const lastC = coords[coords.length - 1][1];
                    for (let i = firstPart; i < word.length; i++) {
                        const r = lastR;
                        const c = lastC + (i - firstPart + 1) * v.hDir;
                        if (c < 0 || c >= gridSizeVal) { canPlace = false; break; }
                        if (tempGrid[r][c] !== null && tempGrid[r][c] !== word[i]) { canPlace = false; break; }
                        coords.push([r, c]);
                    }
                }
                
                if (canPlace && coords.length === word.length) {
                    for (let i = 0; i < coords.length; i++) {
                        const [r, c] = coords[i];
                        if (tempGrid[r][c] === null) {
                            tempGrid[r][c] = word[i];
                        }
                    }
                    return { coords, direction: 'L' };
                }
            }
        }
    }
    return null;
}
// Размещение слова со множеством поворотов (змеиное размещение)
function tryPlaceSnakeWord(word, tempGrid, gridSizeVal) {
    const maxAttempts = 2000;
    const directions = [
        { dr: 0, dc: 1 },  // вправо
        { dr: 0, dc: -1 }, // влево
        { dr: 1, dc: 0 },  // вниз
        { dr: -1, dc: 0 }  // вверх
    ];
    
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        // Стартовая позиция
        const startRow = Math.floor(Math.random() * gridSizeVal);
        const startCol = Math.floor(Math.random() * gridSizeVal);
        
        if (tempGrid[startRow][startCol] !== null) continue;
        
        const coords = [];
        let currentRow = startRow;
        let currentCol = startCol;
        let placed = true;
        const usedCoords = new Set();
        usedCoords.add(`${startRow},${startCol}`);
        coords.push([startRow, startCol]);
        
        // Текущее направление
        let currentDir = directions[Math.floor(Math.random() * directions.length)];
        let stepsInCurrentDir = 0;
        let maxStepsInDir = Math.floor(Math.random() * 3) + 1; // 1-3 шага в одном направлении
        
        for (let i = 1; i < word.length; i++) {
            // Если прошли maxStepsInDir шагов, меняем направление
            if (stepsInCurrentDir >= maxStepsInDir) {
                // Выбираем новое направление (не противоположное текущему)
                const availableDirs = directions.filter(d => 
                    !(d.dr === -currentDir.dr && d.dc === -currentDir.dc)
                );
                currentDir = availableDirs[Math.floor(Math.random() * availableDirs.length)];
                stepsInCurrentDir = 0;
                maxStepsInDir = Math.floor(Math.random() * 3) + 1;
            }
            
            const nextRow = currentRow + currentDir.dr;
            const nextCol = currentCol + currentDir.dc;
            const key = `${nextRow},${nextCol}`;
            
            // Проверяем границы
            if (nextRow < 0 || nextRow >= gridSizeVal || nextCol < 0 || nextCol >= gridSizeVal) {
                placed = false;
                break;
            }
            
            // Проверяем занятость
            if (tempGrid[nextRow][nextCol] !== null && tempGrid[nextRow][nextCol] !== word[i]) {
                placed = false;
                break;
            }
            
            // Проверяем, что не ходим в уже использованную клетку
            if (usedCoords.has(key)) {
                placed = false;
                break;
            }
            
            usedCoords.add(key);
            coords.push([nextRow, nextCol]);
            currentRow = nextRow;
            currentCol = nextCol;
            stepsInCurrentDir++;
        }
        
        if (placed && coords.length === word.length) {
            // Размещаем слово
            for (let i = 0; i < coords.length; i++) {
                const [r, c] = coords[i];
                if (tempGrid[r][c] === null) {
                    tempGrid[r][c] = word[i];
                }
            }
            return { coords, direction: 'S' }; // S = Snake (змея)
        }
    }
    return null;
}
function generateLevel(themeIndex, customWords, retryCount = 0, difficulty = 'easy') {
    const MAX_RETRIES = 15;
    const theme = LEVELS_DATA[themeIndex % LEVELS_DATA.length];
    const gridSizeVal = theme.size;
    const enableLShape = difficulty === 'medium' || difficulty === 'hard' || difficulty === 'expert';
    // Включаем змеиное размещение для hard и expert
      const enableSnake = difficulty === 'hard' || difficulty === 'expert';
    let wordsToPlace = [...customWords];
    
    wordsToPlace.sort((a,b) => b.length - a.length);
    
    let tempGrid = Array(gridSizeVal).fill().map(() => Array(gridSizeVal).fill(null));
    let positions = new Map();
    let allPlaced = true;
    
       
    for (let i = 0; i < wordsToPlace.length; i++) {
        const word = wordsToPlace[i];
        let result = null;
        
        // ✅ ПРАВИЛЬНО: определяем ДЛЯ КАЖДОГО СЛОВА отдельно
        const useLShape = (difficulty === 'medium' || difficulty === 'hard' || difficulty === 'expert') || 
                          (difficulty === 'easy' && word.length > 8);
        
        // Для длинных слов сначала пробуем змеиное размещение (hard/expert)
        if (enableSnake && word.length >= 6) {
            result = tryPlaceSnakeWord(word, tempGrid, gridSizeVal);
        }
        
        // Если не получилось змеиное — пробуем Г-образное
        if (!result && useLShape && word.length >= 4) {
            result = tryPlaceLShapeWord(word, tempGrid, gridSizeVal, positions, i);
        }
        
        // Если не получилось Г-образное — пробуем обычное
        if (!result) {
            result = tryPlaceWordWithIntersections(word, tempGrid, gridSizeVal, positions, i, wordsToPlace.length);
        }
        
        if (result) {
            positions.set(word, result);
        } else {
            allPlaced = false;
            break;
        }
    }
    
    // Если не все слова разместились, пробуем снова
    if (!allPlaced && retryCount < MAX_RETRIES) {
        return generateLevel(themeIndex, customWords, retryCount + 1);
    }
    
    // Принудительное размещение
    if (!allPlaced) {
        for (let i = 0; i < wordsToPlace.length; i++) {
            const word = wordsToPlace[i];
            if (!positions.has(word)) {
                let forced = false;
                for (let r = 0; r < gridSizeVal && !forced; r++) {
                    for (let c = 0; c <= gridSizeVal - word.length; c++) {
                        let can = true;
                        for (let k = 0; k < word.length; k++) {
                            if (tempGrid[r][c+k] !== null && tempGrid[r][c+k] !== word[k]) {
                                can = false;
                                break;
                            }
                        }
                        if (can) {
                            for (let k = 0; k < word.length; k++) {
                                if (tempGrid[r][c+k] === null) tempGrid[r][c+k] = word[k];
                            }
                            positions.set(word, { coords: Array.from({length: word.length}, (_,k) => [r, c+k]), direction: 'H' });
                            forced = true;
                            break;
                        }
                    }
                }
                if (!forced) {
                    for (let c = 0; c < gridSizeVal && !forced; c++) {
                        for (let r = 0; r <= gridSizeVal - word.length; r++) {
                            let can = true;
                            for (let k = 0; k < word.length; k++) {
                                if (tempGrid[r+k][c] !== null && tempGrid[r+k][c] !== word[k]) {
                                    can = false;
                                    break;
                                }
                            }
                            if (can) {
                                for (let k = 0; k < word.length; k++) {
                                    if (tempGrid[r+k][c] === null) tempGrid[r+k][c] = word[k];
                                }
                                positions.set(word, { coords: Array.from({length: word.length}, (_,k) => [r+k, c]), direction: 'V' });
                                forced = true;
                                break;
                            }
                        }
                    }
                }
            }
        }
    }
    
    // Заполняем пустые клетки
    for (let i = 0; i < gridSizeVal; i++) {
        for (let j = 0; j < gridSizeVal; j++) {
            if (tempGrid[i][j] === null) {
                tempGrid[i][j] = RUS_LETTERS[Math.floor(Math.random() * RUS_LETTERS.length)];
            }
        }
    }
    
    // ФИНАЛЬНАЯ ПРОВЕРКА: все ли слова на месте
    for (let word of wordsToPlace) {
        if (!positions.has(word)) {
            console.error(`❌ Слово "${word}" не разместилось! Перегенерация...`);
            if (retryCount < MAX_RETRIES) {
                return generateLevel(themeIndex, customWords, retryCount + 1);
            }
        }
    }
    
    return { grid: tempGrid, size: gridSizeVal, words: wordsToPlace, positions };
}

// Размещение слова с поиском пересечений
function tryPlaceWordWithIntersections(word, tempGrid, gridSizeVal, existingWordsPositions, wordIndex, totalWords) {
    const maxAttempts = 1500; // было 800, увеличил для надёжности
    
    const preferHorizontal = (wordIndex % 2 === 0);
    
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const tryHorizontal = preferHorizontal ? [true, false] : [false, true];
        
        for (let isHorizontal of tryHorizontal) {
            let maxRow = isHorizontal ? gridSizeVal : gridSizeVal - word.length + 1;
            let maxCol = isHorizontal ? gridSizeVal - word.length + 1 : gridSizeVal;
            
            if (maxRow <= 0 || maxCol <= 0) continue;
            
            const row = Math.floor(Math.random() * maxRow);
            const col = Math.floor(Math.random() * maxCol);
            
            let conflict = false;
            const coords = [];
            let hasIntersection = false;
            
            for (let i = 0; i < word.length; i++) {
                const r = isHorizontal ? row : row + i;
                const c = isHorizontal ? col + i : col;
                const existingLetter = tempGrid[r][c];
                
                if (existingLetter !== null && existingLetter !== word[i]) {
                    conflict = true;
                    break;
                }
                if (existingLetter === word[i]) {
                    hasIntersection = true;
                }
                coords.push([r, c]);
            }
            
            if (!conflict) {
                // Для первых слов не требуем пересечений, для остальных - желательно
                if (wordIndex >= 2 && !hasIntersection && existingWordsPositions.size > 0) {
                    const willRetry = attempt < maxAttempts - 200;
                    if (willRetry) continue;
                }
                
                for (let i = 0; i < word.length; i++) {
                    const r = isHorizontal ? row : row + i;
                    const c = isHorizontal ? col + i : col;
                    if (tempGrid[r][c] === null) {
                        tempGrid[r][c] = word[i];
                    }
                }
                return { coords, direction: isHorizontal ? 'H' : 'V' };
            }
        }
    }
    return null;
}

  // Проверка для Г-образных слов (средняя сложность)
function checkLShapeOrder(chain, correctCoords) {
    if (chain.length !== correctCoords.length) return false;
    
    // Для каждой позиции проверяем, что координаты совпадают
    // ИЛИ (если позиция крайняя) что это правильная буква на соседней клетке
    for (let i = 0; i < chain.length; i++) {
        const expectedRow = correctCoords[i][0];
        const expectedCol = correctCoords[i][1];
        const actualRow = chain[i].row;
        const actualCol = chain[i].col;
        
        // Если координаты совпадают — отлично
        if (actualRow === expectedRow && actualCol === expectedCol) {
            continue;
        }
        
        // Если это первая или последняя буква, проверяем альтернативную клетку
        const isFirstOrLast = (i === 0 || i === chain.length - 1);
        if (isFirstOrLast) {
            // Проверяем, что это соседняя клетка с той же буквой
            const expectedLetter = grid[expectedRow][expectedCol];
            const actualLetter = grid[actualRow][actualCol];
            
            if (expectedLetter !== actualLetter) return false;
            
            // Проверяем, что это одна из соседних клеток
            const isAdjacent = (Math.abs(actualRow - expectedRow) + Math.abs(actualCol - expectedCol)) <= 1;
            if (!isAdjacent) return false;
            
            // Проверяем, что эта клетка не занята другим словом
            if (isCellFound(actualRow, actualCol)) return false;
            
            // Проверяем, что эта клетка ещё не использована в цепочке
            const alreadyUsed = chain.some((c, idx) => idx !== i && c.row === actualRow && c.col === actualCol);
            if (alreadyUsed) return false;
        } else {
            // Для внутренних букв — строгое совпадение
            return false;
        }
    }
    return true;
}
// Обработка клика по клетке
function onCellClick(row, col) {
    playTapSound();

    // Теперь можно кликать на ЛЮБЫЕ буквы, даже зелёные    
    // Если нет активной цепочки — начинаем новую с этой клетки
    if (currentChain.length === 0) {
        currentChain = [{ row, col }];
        highlightCurrentChain();
        return;
    }
    
    // Получаем последнюю клетку в цепочке
    const last = currentChain[currentChain.length - 1];
    const isAdjacentHor = (Math.abs(last.row - row) === 0 && Math.abs(last.col - col) === 1);
    const isAdjacentVer = (Math.abs(last.row - row) === 1 && Math.abs(last.col - col) === 0);
    
    // проверка, не выбрана ли уже эта клетка в текущей цепочке (нельзя повторять)
    const alreadyInChain = currentChain.some(c => c.row === row && c.col === col);
    if (alreadyInChain) {
        playErrorTone();
        showMessage('⚠️ Нельзя выбрать ту же букву дважды в одном слове', 700);
        return;
    }
    
    if (isAdjacentHor || isAdjacentVer) {
        // Добавляем новую букву
        currentChain.push({ row, col });
        highlightCurrentChain();
        
        // АВТОПРОВЕРКА: проверяем, собрано ли слово целиком
        const selectedWord = currentChain.map(c => grid[c.row][c.col]).join('');
        const remainingWords = levelWords.filter(w => !foundWordsSet.has(w));
        const matchedWord = remainingWords.find(w => w === selectedWord);
        
        if (matchedWord) {
            const info = wordPositionMap.get(matchedWord);
            if (info) {
                const correctCoords = info.coords;
                let isCorrectOrder = false;
                
                // Проверка типа слова
                if (info.direction === 'S') {
                    // ЗМЕИНЫЕ СЛОВА — строгая проверка координат (как в лабиринте)
                    isCorrectOrder = currentChain.length === correctCoords.length &&
                        currentChain.every((coord, idx) => 
                            coord.row === correctCoords[idx][0] && coord.col === correctCoords[idx][1]
                        );
                } else if (info.direction === 'L') {
                    // Г-ОБРАЗНЫЕ СЛОВА — проверка с учётом альтернативных крайних букв
                    isCorrectOrder = checkLShapeOrder(currentChain, correctCoords);
                } else {
                    // ПРЯМЫЕ СЛОВА — строгая проверка
                    isCorrectOrder = currentChain.length === correctCoords.length &&
                        currentChain.every((coord, idx) => 
                            coord.row === correctCoords[idx][0] && coord.col === correctCoords[idx][1]
                        );
                }
                
                                if (isCorrectOrder) {
                        foundWordsSet.add(matchedWord);
                        
                        // ✅ Запоминаем цвет для этого слова
                        if (!wordColorsMap.has(matchedWord)) {
                            wordColorsMap.set(matchedWord, getNextWordColor());
                              }
                    
                    updateFoundCellsColor();
                    renderWordsList();
                    foundCounterSpan.innerText = foundWordsSet.size;
                    playSuccessSound();
                    showMessage(`🎉 Найдено слово: ${matchedWord}! 🎉`, 1600);
                    currentChain = [];
                    highlightCurrentChain();
                    
                    if (foundWordsSet.size === levelWords.length) {
                        showMessage(`🏆 ПОБЕДА! Уровень пройден! 🏆`, 2500);
                        playSuccessSound();
                        
                        // СОХРАНЯЕМ ПРОГРЕСС
                        if (typeof currentLevelId !== 'undefined') {
                            saveCompletedLevel(currentLevelId, currentDifficulty);
                        } else {
                            console.log('currentLevelId не определён');
                        }
                        
                        // АКТИВИРУЕМ КНОПКУ СЛЕДУЮЩЕГО УРОВНЯ
                        const nextBtn = document.getElementById('nextLevelBtn');
                        nextBtn.disabled = false;
                        nextBtn.style.opacity = '1';
                        nextBtn.style.cursor = 'pointer';
                        // ЗАПУСКАЕМ КОНФЕТТИ
                        showConfetti();
                    }
                } else {
                    // Слово собрано, но порядок не тот
                    playErrorTone();
                    showMessage(`❌ "${matchedWord}" — буквы верны, но порядок не совпадает с линией слова!`, 1700);
                    animateWrong(currentChain);
                    currentChain = [];
                    highlightCurrentChain();
                }
            }
        }
        // Если слово не совпало - ничего не делаем, продолжаем собирать
    } else {
        // нажали не на соседнюю — сбросить и начать заново
        playErrorTone();
        showMessage('🚫 Буквы должны идти подряд! Начинаем заново', 1100);
        animateWrong(currentChain);
        currentChain = [{ row, col }];
        highlightCurrentChain();
    }
}

   // Функция для запуска конфетти
function showConfetti() {
    const duration = 3000; // 3 секунды
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000, colors: ['#FFD700', '#FFA54D', '#6B9C3F', '#FF6B6B', '#4ECDC4'] };

    function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
            return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        
        // Конфетти с двух сторон
        confetti({
            ...defaults,
            particleCount: Math.floor(particleCount),
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        });
        confetti({
            ...defaults,
            particleCount: Math.floor(particleCount),
            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        });
    }, 250);
}

//================конец приветственного сюжета
function getGalaxyStars() {
    const stars = {};
    const difficulties = ['easy', 'medium', 'hard', 'expert'];
    
    difficulties.forEach(diff => {
        const completedLevels = getCompletedLevels(diff);
        // ✅ ИСПРАВЛЕНИЕ: получаем категории ДЛЯ КАЖДОЙ сложности отдельно
        const categories = getCategoriesForDifficulty(diff);
        categories.forEach(cat => {
            // ✅ ИСПРАВЛЕНИЕ: получаем уровни с учётом сложности
            const categoryLevels = getLevelsByCategoryAndDifficulty(cat.id, diff);
            let completedCount = 0;
            categoryLevels.forEach(level => {
                const levelId = getLevelId(cat.id, level.levelNum, diff);
                if (completedLevels.includes(levelId)) {
                    completedCount++;
                }
            });
            const key = `${cat.id}_${diff}`;
            stars[key] = {
                categoryId: cat.id,
                difficulty: diff,
                totalStars: completedCount * 5,
                maxStars: categoryLevels.length * 5,
                completedLevels: completedCount,
                totalLevels: categoryLevels.length
            };
        });
    });
    return stars;
}

                const uniqueKey = `${cat.id}_${diff}`;

                        ...cat,
                        difficulty: diff,

// Функция для получения общего количества звёзд
function getTotalStars() {
    // Если totalStars = 0, но в localStorage есть значение — используем его
    if (totalStars === 0) {
        const saved = localStorage.getItem('totalStars');
        if (saved) {

    return totalStars;
}

function getUnlockedScrolls() {
    const saved = localStorage.getItem('unlockedScrolls');
    return saved ? JSON.parse(saved) : [];
}

// Открыть свиток
function unlockScroll(scrollId) {
    const unlocked = getUnlockedScrolls();
    if (!unlocked.includes(scrollId)) {
        unlocked.push(scrollId);
        localStorage.setItem('unlockedScrolls', JSON.stringify(unlocked));
        // ✅ ДОБАВЛЯЕМ СИНХРОНИЗАЦИЮ
        if (typeof saveToVKStorage === 'function') {
            saveToVKStorage('wordgame_scrolls_v2', unlocked);
            console.log('📜 Свиток ' + scrollId + ' синхронизирован с VK');
        }
    }
}

// Проверить, открыт ли свиток
function isScrollUnlocked(scrollId) {
    return getUnlockedScrolls().includes(scrollId);
}

// Рассчитать, сколько свитков должно быть открыто по звёздам
function calculateUnlockedScrolls() {
    const stars = totalStars || parseInt(localStorage.getItem('totalStars') || 0);
    return Math.min(Math.floor(stars / 100), WISDOM_SCROLLS.length);
}

// Синхронизировать открытые свитки со звёздами
function syncScrollsWithStars() {
    const shouldBeUnlocked = calculateUnlockedScrolls();
    const unlocked = getUnlockedScrolls();
    let changed = false;
    for (let i = 1; i <= shouldBeUnlocked; i++) {
        if (!unlocked.includes(i)) {
            unlocked.push(i);
            changed = true;
        }
    }
    if (changed) {
        localStorage.setItem('unlockedScrolls', JSON.stringify(unlocked));
        // ✅ СИНХРОНИЗИРУЕМ ВСЕ СВИТКИ СРАЗУ
        if (typeof saveToVKStorage === 'function') {
            saveToVKStorage('wordgame_scrolls_v2', unlocked);
            console.log('📜 Все свитки синхронизированы с VK');
        }
    }
    return shouldBeUnlocked;
}

        if (e.target === modalDiv && options.closeOnBackground !== false) {
            modalDiv.remove();
        }
    });
    
    return { modalDiv, modalContent };
}

// ====== VK STORAGE СИНХРОНИЗАЦИЯ ======

// Сохранение в VK Storage
function saveToVKStorage(key, value) {
    if (typeof vkBridge === 'undefined') {
        console.log('ℹ️ VK Bridge не доступен');
        return Promise.resolve();
    }
    
    return vkBridge.send('VKWebAppStorageSet', {
        key: key,
        value: typeof value === 'string' ? value : JSON.stringify(value)
    })
    .then(() => console.log(`✅ Сохранено в VK Storage: ${key}`))
    .catch((error) => console.warn(`❌ Ошибка сохранения ${key}:`, error));
}

// Загрузка из VK Storage
function loadFromVKStorage(key) {
    if (typeof vkBridge === 'undefined') {
        return Promise.resolve(null);
    }
    
    return vkBridge.send('VKWebAppStorageGet', { keys: [key] })
        .then((data) => {
            if (data && data.keys && Array.isArray(data.keys) && data.keys.length > 0) {
                const value = data.keys[0].value;
                try { return JSON.parse(value); } catch { return value; }
            }
            return null;
        })
        .catch((error) => {
            console.warn(`❌ Ошибка загрузки ${key}:`, error);
            return null;
        });
}

// Сохранение темы в VK Storage (обёртка над setTheme)
const originalSetTheme = setTheme;
setTheme = function(themeName) {
    originalSetTheme(themeName);
    if (typeof saveToVKStorage === 'function') {
        saveToVKStorage('wordgame_theme_v2', themeName);
    }
};

// Синхронизация прогресса при завершении уровня
const originalSaveCompleted = saveCompletedLevel;
saveCompletedLevel = function(levelId, difficulty) {
    originalSaveCompleted(levelId, difficulty);
    setTimeout(syncAllDataToVK, 500); // ← вместо отдельных saveToVKStorage
};

function loadAllDataFromVK() {
    if (typeof vkBridge === 'undefined') return;
    
    console.log('🔄 Загрузка данных из VK Storage...');
    
    Promise.all([
        loadFromVKStorage('wordgame_theme_v2'),
        loadFromVKStorage('wordgame_galaxy_v2'),
        loadFromVKStorage('wordgame_scrolls_v2'),
        loadFromVKStorage('wordgame_total_stars_v2'),
        loadFromVKStorage('wordgame_completed_easy'),
        loadFromVKStorage('wordgame_completed_medium'),
        loadFromVKStorage('wordgame_completed_hard'),
        loadFromVKStorage('wordgame_completed_expert')
    ]).then(([theme, galaxyData, scrollsData, totalStarsData, easyData, mediumData, hardData, expertData]) => {
        let loaded = false;
        
        // ====== ТЕМА ======
        if (theme) {
            setTheme(theme);
            loaded = true;
            console.log('✅ Тема загружена из VK');
        }
        
        // ====== ГАЛАКТИКА (МЕРЖ) ======
        if (galaxyData) {
            try {
                const currentStars = getGalaxyStars();
                let merged = false;
                
                // Объединяем: берём МАКСИМУМ по каждой категории
                for (const key in galaxyData) {
                    if (galaxyData[key]) {
                        const vkStars = galaxyData[key].totalStars || 0;
                        const localStars = currentStars[key]?.totalStars || 0;
                        
                        if (vkStars > localStars) {
                            // В VK больше — обновляем локальные
                            const catId = galaxyData[key].categoryId;
                            const diff = galaxyData[key].difficulty;
                            const levels = getLevelsByCategoryAndDifficulty(catId, diff);
                            const completed = [];
                            for (let i = 0; i < levels.length && i < galaxyData[key].completedLevels; i++) {
                                completed.push(levels[i].id);
                            }
                            const keyName = `gameCompletedLevels_${diff}`;
                            localStorage.setItem(keyName, JSON.stringify(completed));
                            merged = true;
                        }
                    }
                }
                
                if (merged) {
                    updateTotalStars();
                    loaded = true;
                    console.log('✅ Галактика объединена (взято максимум)');
                }
            } catch(e) {
                console.warn('⚠️ Ошибка загрузки галактики:', e);
            }
        }
        
        // ====== СВИТКИ (МЕРЖ - ОБЪЕДИНЯЕМ) ======
        if (scrollsData && Array.isArray(scrollsData)) {
            const localScrolls = getUnlockedScrolls();
            // ✅ БЕРЁМ МАКСИМУМ: объединяем оба массива
            const mergedScrolls = [...new Set([...localScrolls, ...scrollsData])];
            
            if (mergedScrolls.length > localScrolls.length) {
                localStorage.setItem('unlockedScrolls', JSON.stringify(mergedScrolls));
                loaded = true;
                console.log('✅ Свитки объединены: ' + localScrolls.length + ' → ' + mergedScrolls.length);
            } else {
                console.log('ℹ️ Новых свитков из VK нет');
            }
        }
        
        // ====== ОБЩИЕ ЗВЁЗДЫ (МЕРЖ - БЕРЁМ МАКСИМУМ) ======
        if (totalStarsData !== null && totalStarsData !== undefined) {
            const localTotal = parseInt(localStorage.getItem('totalStars') || '0');
            const maxTotal = Math.max(localTotal, totalStarsData);
            if (maxTotal > localTotal) {
                localStorage.setItem('totalStars', String(maxTotal));
                totalStars = maxTotal;
                loaded = true;
                console.log('✅ Общие звёзды обновлены: ' + localTotal + ' → ' + maxTotal);
            }
        }
        
        // ====== ПРОЙДЕННЫЕ УРОВНИ (МЕРЖ) ======
        const diffKeys = ['easy', 'medium', 'hard', 'expert'];
        const diffDataMap = { easy: easyData, medium: mediumData, hard: hardData, expert: expertData };
        
        diffKeys.forEach(diff => {
            const vkData = diffDataMap[diff];
            if (vkData && Array.isArray(vkData)) {
                const localCompleted = getCompletedLevels(diff);
                // ✅ ОБЪЕДИНЯЕМ: берём все уникальные ID
                const merged = [...new Set([...localCompleted, ...vkData])];
                if (merged.length > localCompleted.length) {
                    const keyName = `gameCompletedLevels_${diff}`;
                    localStorage.setItem(keyName, JSON.stringify(merged));
                    loaded = true;
                    console.log('✅ Уровни ' + diff + ' объединены: ' + localCompleted.length + ' → ' + merged.length);
                }
            }
        });
        
        if (loaded) {
            console.log('✅ Данные из VK Storage загружены и объединены');
            // Обновляем UI
            updateTotalStars();
            const galaxyBtn = document.getElementById('galaxyBtn');
            if (galaxyBtn) {
                galaxyBtn.setAttribute('data-stars', totalStars || 0);
            }
            // ПЕРЕСОХРАНЯЕМ В VK (чтобы там были ВСЕ данные)
            syncAllDataToVK();
        } else {
            console.log('ℹ️ В VK Storage нет новых данных');
        }
    }).catch(e => console.warn('⚠️ Ошибка загрузки из VK:', e));
}

// Полная синхронизация всех данных
function syncAllDataToVK() {
    if (typeof vkBridge === 'undefined') return;
    
    console.log('🔄 Полная синхронизация с VK Storage...');
    
    const completedEasy = getCompletedLevels('easy');
    const completedMedium = getCompletedLevels('medium');
    const completedHard = getCompletedLevels('hard');
    const completedExpert = getCompletedLevels('expert');
    const stars = getGalaxyStars();
    const scrolls = getUnlockedScrolls();
    const total = updateTotalStars();
    const theme = currentTheme || localStorage.getItem('theme') || 'dark';
    
    Promise.all([
        saveToVKStorage('wordgame_theme_v2', theme),
        saveToVKStorage('wordgame_galaxy_v2', stars),
        saveToVKStorage('wordgame_scrolls_v2', scrolls),
        saveToVKStorage('wordgame_total_stars_v2', total),
        saveToVKStorage('wordgame_completed_easy', completedEasy),
        saveToVKStorage('wordgame_completed_medium', completedMedium),
        saveToVKStorage('wordgame_completed_hard', completedHard),
        saveToVKStorage('wordgame_completed_expert', completedExpert)
    ]).then(() => {
        console.log('✅ Полная синхронизация завершена');
    }).catch(e => console.warn('⚠️ Ошибка синхронизации:', e));
}
// Запуск синхронизации при старте
(function() {
    if (typeof vkBridge !== 'undefined') {
        setTimeout(loadAllDataFromVK, 1500);
        
        // Авто-синхронизация каждые 60 секунд (на случай, если пользователь играет долго)
        setInterval(syncAllDataToVK, 60000);
    }
})();
