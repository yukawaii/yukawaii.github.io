<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <title>Карточки — Хирагана</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .memory-menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .memory-menu-grid .btn-neon {
            width: 100%;
            font-size: 14px;
            padding: 10px 8px;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }
        .menu-label {
            display: block;
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
            font-weight: 400;
        }

        @media (max-width: 600px) {
            .memory-menu-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .memory-menu-grid .btn-neon {
                font-size: 13px;
                padding: 8px 6px;
            }
        }
        @media (max-width: 400px) {
            .memory-menu-grid {
                gap: 8px;
            }
            .memory-menu-grid .btn-neon {
                font-size: 12px;
                padding: 6px 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card" style="text-align: center;">

        <h2 style="font-size: 2rem; margin-bottom: 5px;">🃏 Память</h2>
        <p style="color: var(--text-secondary); margin-bottom: 15px;">Выбери набор карточек для игры</p>

        <div class="theme-picker">
            <button class="theme-btn active" data-theme="cosmic" onclick="setTheme('cosmic')">🌌 Космос</button>
            <button class="theme-btn" data-theme="pastel" onclick="setTheme('pastel')">🌸 Пастель</button>
            <button class="theme-btn" data-theme="blue" onclick="setTheme('blue')">💎 Голубая</button>
        </div>

        <div class="memory-menu-grid">
            <!-- Ряды хираганы (あ＋あ) -->
            <a href="index2.html" class="btn-neon">あ行 <span class="menu-label">あ・い・う・え・お</span></a>
            <a href="index3.html" class="btn-neon">か行 <span class="menu-label">か・き・く・け・こ</span></a>
            <a href="index4.html" class="btn-neon">さ行 <span class="menu-label">さ・し・す・せ・そ</span></a>
            <a href="index5.html" class="btn-neon">た行 <span class="menu-label">た・ち・つ・て・と</span></a>
            <a href="index6.html" class="btn-neon">な行 <span class="menu-label">な・に・ぬ・ね・の</span></a>
            <a href="index7.html" class="btn-neon">は行 <span class="menu-label">は・ひ・ふ・へ・ほ</span></a>
            <a href="index8.html" class="btn-neon">ま行 <span class="menu-label">ま・み・む・め・も</span></a>
            <a href="index9.html" class="btn-neon">ら行 <span class="menu-label">ら・り・る・れ・ろ</span></a>
            <a href="index10.html" class="btn-neon">や・わ行 <span class="menu-label">や・ゆ・よ・わ・を・ん</span></a>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px;">
            <a href="1mem.html" class="btn-neon">🔄 Карточки "あ＋А"</a>
            <a href="../index.html" class="btn-neon">🏠 В начало</a>         
            <button class="btn-neon" onclick="favor1()">⭐ В избранное</button>
        </div>

    </div>
</div>

<script src="../App.js"></script>
</body>
</html>
