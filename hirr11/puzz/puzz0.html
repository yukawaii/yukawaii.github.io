<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Пазлы — Хирагана</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    .puzz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }
    .puzz-grid .btn-neon {
      width: 100%;
      font-size: 14px;
      padding: 10px 12px;
    }
    .level-label {
      display: block;
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }
    @media (max-width: 600px) {
      .puzz-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    }
    @media (max-width: 400px) {
      .puzz-grid { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="glass-card" style="text-align: center;">

    <h2 style="font-size: 2rem; margin-bottom: 5px;">🧩 Космические пазлы</h2>
    <p style="color: var(--text-secondary); margin-bottom: 15px;">Собери картинку со знаком хирагана</p>

    <div class="theme-picker">
      <button class="theme-btn active" data-theme="cosmic" onclick="setTheme('cosmic')">🌌 Космос</button>
      <button class="theme-btn" data-theme="pastel" onclick="setTheme('pastel')">🌸 Пастель</button>
      <button class="theme-btn" data-theme="blue" onclick="setTheme('blue')">💎 Голубая</button>
    </div>

    <div class="puzz-grid">
      <a href="puzz1.html" class="btn-neon">あ行・か行 <span class="level-label">Уровень 1</span></a>
      <a href="puzz2.html" class="btn-neon">さ行・た行 <span class="level-label">Уровень 2</span></a>
      <a href="puzz3.html" class="btn-neon">な行・は行 <span class="level-label">Уровень 3</span></a>
      <a href="puzz4.html" class="btn-neon">ま行・ら行 <span class="level-label">Уровень 4</span></a>
      <a href="puzz5.html" class="btn-neon">や行・わ行 <span class="level-label">Уровень 5</span></a>
    </div>

    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="../index.html" class="btn-neon">🏠 В начало</a>
      <button class="btn-neon" onclick="share2()">📤 Поделиться</button>
    </div>

  </div>
</div>

<script src="../App.js"></script>
</body>
</html>
