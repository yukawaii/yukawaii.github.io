<script>// Запрещаем скролл на всех тач-событиях
document.addEventListener('touchmove', function(e) {
    // Разрешаем скролл только внутри модалок с классом modal-overlay__content
    if (e.target.closest('.modal-overlay__content')) {
        return;
    }
    e.preventDefault();
}, { passive: false });

// Запрещаем свайп вниз (pull-to-refresh)
document.addEventListener('touchstart', function(e) {
    if (e.target.closest('.modal-overlay__content')) {
        return;
    }
    // Запоминаем начальную позицию
    const touch = e.touches[0];
    const startY = touch.clientY;
    
    const handleMove = function(e2) {
        const deltaY = e2.touches[0].clientY - startY;
        // Если свайп вниз и мы вверху страницы — блокируем
        if (deltaY > 10 && window.scrollY <= 0) {
            e2.preventDefault();
        }
    };
    
    document.addEventListener('touchmove', handleMove, { passive: false });
}, { passive: true });
</script>
