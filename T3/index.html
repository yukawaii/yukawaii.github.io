.neon-title {
    color: #4ade80;
    text-shadow:
        0 0 2px rgba(52, 211, 153, 0.3),
        0 0 6px rgba(52, 211, 153, 0.2),
        0 0 14px rgba(52, 211, 153, 0.1);
    position: relative;
    animation: glitch 2s ease-in-out infinite;
}

@keyframes glitch {
    0%, 100% {
        text-shadow: 
            0 0 2px rgba(52, 211, 153, 0.3),
            0 0 6px rgba(52, 211, 153, 0.2),
            0 0 14px rgba(52, 211, 153, 0.1);
        transform: translate(0);
    }
    2% {
        text-shadow: 
            2px 0 rgba(255, 0, 150, 0.3),
            -2px 0 rgba(0, 255, 255, 0.3),
            0 0 8px rgba(52, 211, 153, 0.2);
        transform: translate(1px, -1px);
    }
    4% {
        text-shadow: 
            -1px 0 rgba(255, 0, 150, 0.2),
            1px 0 rgba(0, 255, 255, 0.2),
            0 0 8px rgba(52, 211, 153, 0.2);
        transform: translate(-1px, 0);
    }
    6% {
        text-shadow: 
            0 0 2px rgba(52, 211, 153, 0.3),
            0 0 6px rgba(52, 211, 153, 0.2),
            0 0 14px rgba(52, 211, 153, 0.1);
        transform: translate(0);
    }
    92% {
        text-shadow: 
            0 0 2px rgba(52, 211, 153, 0.3),
            0 0 6px rgba(52, 211, 153, 0.2),
            0 0 14px rgba(52, 211, 153, 0.1);
        transform: translate(0);
    }
    94% {
        text-shadow: 
            1px 0 rgba(255, 0, 150, 0.3),
            -1px 0 rgba(0, 255, 255, 0.3),
            0 0 8px rgba(52, 211, 153, 0.2);
        transform: translate(-1px, 1px);
    }
    96% {
        text-shadow: 
            -2px 0 rgba(255, 0, 150, 0.2),
            2px 0 rgba(0, 255, 255, 0.2),
            0 0 8px rgba(52, 211, 153, 0.2);
        transform: translate(1px, 0);
    }
    98% {
        text-shadow: 
            0 0 2px rgba(52, 211, 153, 0.3),
            0 0 6px rgba(52, 211, 153, 0.2),
            0 0 14px rgba(52, 211, 153, 0.1);
        transform: translate(0);
    }
}

    /* ВЕРТИКАЛЬНЫЕ ТЕЛЕФОНЫ */
   
@media (max-width: 768px) and (orientation: portrait) {

    .pc-only-leader { display: none !important; }
    #yandex-highscore-side { display: none !important; }
    #yandex-highscore-top { display: block !important; }
    
    .game-wrapper {
        flex-direction: column;
        justify-content: space-between;

        gap: 2px;

         height: 100dvh; /* используем динамическую высоту */
    }
    .canvas-container {
        width: 100%;
       /* height: calc(100vh - 200px);   ← стало как в первой игре 
        max-height: calc(100vh - 200px);*/

    }
    .controls-container {

    }

    }
    .instructions { display: none; }
    
   .mobile-joystick{ display: flex; width: 100%; justify-content: space-between; align-items: flex-start; margin-top: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; flex: 0 1 auto; z-index: 1;}
 .d-pad{ display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); background: transparent; border-radius: 0; padding: 0; border: none; gap: 4px; align-self: flex-start; margin: 0; margin-top: -40px; position: relative; top: 0; z-index: 1;}
    
    .d-btn {
        background: #282836;
        border: none;
        color: #fff;
        font-size: 13px;              /* ← увеличен */
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        border-radius: 8px;           /* ← увеличен */
        box-shadow: 0 3px 0 #14141a;  /* ← больше тень */
        width: 100%;
        height: 100%;
    }
    .d-btn:active {
        background: #14141a;
        transform: translateY(2px);
        box-shadow: none;
    }
    .d-btn.b-left { grid-column: 1; grid-row: 2; }
    .d-btn.b-down { grid-column: 2; grid-row: 3; }
    .d-btn.b-right { grid-column: 3; grid-row: 2; }
    .d-pad-center {
        grid-column: 2;
        grid-row: 2;
        background: #1e1e28;
        border-radius: 4px;
    }
    
    .leaderboard-pad {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
    }
    #btn-leader {
        width: 42px !important;
        height: 42px !important;
        background: #282836;
        border: none;
        border-radius: 50%;
        box-shadow: 0 3px 0 #14141a;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        padding: 0;
    }
    #btn-leader img {
        width: 20px !important;
        height: 20px !important;
        filter: none !important;
    }
    .leaderboard-pad span {
        font-size: 8px;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
    }
    
    .action-pad {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-right: 15px;          /* ← отступ справа как в первой игре */
        margin-top: 5px;
    }
    
    /* Стильная чёрно-зелёная кнопка поворота (как в первой игре) */
    .rotate-btn {
        width: 65px;
        height: 65px;
        background: linear-gradient(145deg, #0a0a12, #1a1a2e);
        border: 2px solid rgba(52, 211, 153, 0.6);
        border-radius: 50%;
        color: #34d399;
        font-size: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
        box-shadow: 
            0 0 20px rgba(52, 211, 153, 0.15),
            inset 0 0 20px rgba(52, 211, 153, 0.05),
            0 4px 15px rgba(0, 0, 0, 0.5);
        text-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
    }
    .rotate-btn:hover {
        box-shadow: 
            0 0 35px rgba(52, 211, 153, 0.3),
            inset 0 0 30px rgba(52, 211, 153, 0.1),
            0 4px 20px rgba(0, 0, 0, 0.6);
        transform: scale(1.05);
    }
    .rotate-btn:active {
        transform: scale(0.92);
        box-shadow: 
            0 0 50px rgba(52, 211, 153, 0.4),
            inset 0 0 40px rgba(52, 211, 153, 0.15);
        background: linear-gradient(145deg, #0d0d1a, #15152a);
    }
    .rotate-btn::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        padding: 2px;
        background: conic-gradient(
            from 0deg,
            transparent,
            #34d399,
            transparent,
            #34d399,
            transparent
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: rotateBorder 4s linear infinite;
        opacity: 0.6;
    }
    .rotate-btn::after {
        content: '';
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        background: radial-gradient(circle at center, rgba(52, 211, 153, 0.1), transparent 70%);
        opacity: 0;
        transition: opacity 0.4s ease;
    }
    .rotate-btn:hover::after {
        opacity: 1;
    }
    
    .action-label {
        font-size: 8px;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
        text-align: center;
        display: block;
        width: 100%;
    }

/* ===== АНИМИРОВАННАЯ ГАЛОЧКА ===== */
.achievement-item__checkmark {
    display: inline-block;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    position: relative;
}

.achievement-item__checkmark svg {
    width: 24px;
    height: 24px;
    display: block;
}

.achievement-item__checkmark .checkmark-path {
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
    animation: checkmarkDraw 2s ease-in-out infinite;
}

@keyframes checkmarkDraw {
    0% { stroke-dashoffset: 30; opacity: 0.4; }
    20% { opacity: 1; }
    50% { stroke-dashoffset: 0; opacity: 1; }
    80% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
}

@keyframes modalPopIn {
    0% { transform: scale(0.85) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
}

@keyframes pulse-gold {
    0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
    50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
    100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
}

<script>// Запрещаем скролл на всех тач-событиях
document.addEventListener('touchmove', function(e) {
    // Разрешаем скролл только внутри модалок с классом modal-overlay__content
    if (e.target.closest('.modal-overlay__content')) {
        return;
    }
    e.preventDefault();
}, { passive: false });

// Запрещаем свайп вниз (pull-to-refresh)
document.addEventListener('touchstart', function(e) {
    if (e.target.closest('.modal-overlay__content')) {
        return;
    }
    // Запоминаем начальную позицию
    const touch = e.touches[0];
    const startY = touch.clientY;
    
    const handleMove = function(e2) {
        const deltaY = e2.touches[0].clientY - startY;
        // Если свайп вниз и мы вверху страницы — блокируем
        if (deltaY > 10 && window.scrollY <= 0) {
            e2.preventDefault();
        }
    };
    
    document.addEventListener('touchmove', handleMove, { passive: false });
}, { passive: true });
</script>
