<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="sweetalert.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Тетрис Black</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <style type="text/css">
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #131316; font-family: 'Russo One', sans-serif; color: #fff; }
    
    /* Главный контейнер на весь экран */
    .game-wrapper { display: flex; flex-direction: row; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 20px; gap: 30px; }
    
    /* Игровой стакан на ПК */
    .canvas-container { display: flex; justify-content: center; align-items: center; background: #000; padding: 6px; border-radius: 20px; height: 94vh; aspect-ratio: 480 / 900; border: 3px solid #2d2d3d; box-shadow: 0 0 35px rgba(0,0,0,0.9); }
    #tetris { width: 100%; height: 100%; object-fit: contain; border-radius: 14px; }

    /* Панель управления на ПК */
    .controls-container { display: flex; flex-direction: column; gap: 20px; width: 260px; background: #1c1c24; padding: 25px; border-radius: 24px; border: 2px solid #2d2d3d; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .top-menu { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    
    /* По умолчанию на ПК кнопка лидеров в меню должна быть видна */
    .pc-only-leader {
        display: inline-flex !important;
        margin-right: 5px;
    }

    /* Кнопки меню */
    .iksweb { 
        width: 100%; cursor: pointer; font-size: 14px; font-family: 'Russo One', sans-serif; text-transform: uppercase; letter-spacing: 1.5px; padding: 14px; color: #a0aec0; background: rgba(255, 255, 255, 0.03); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.2s; 
    }
    .iksweb:active { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .iksweb.start-btn { color: #fff; background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .iksweb.start-btn:active { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    
    .iksweb1 { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; width: 50px; height: 48px; }
    .iksweb1 img { height: 22px; filter: invert(1) opacity(0.7); }
    .instructions { color: #64748b; font-size: 13px; line-height: 1.6; border-top: 1px solid #2d2d3d; padding-top: 20px; }

    /* Мобильный джойстик по умолчанию скрыт */
    .mobile-joystick { display: none; }

    /* ============================================ */
    /* ВЕРТИКАЛЬНЫЕ ТЕЛЕФОНЫ (адаптивность) */
    /* ============================================ */
    @media (max-width: 768px) and (orientation: portrait) {
        /* Скрываем ПК-кнопку лидеров */
        .pc-only-leader { display: none !important; }

        /* Рекорд: показываем над стаканом, прячем в панели */
        #yandex-highscore-side { display: none !important; }
        #yandex-highscore-top { display: block !important; }

        /* Разворачиваем контейнер вертикально */
        .game-wrapper { 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 10px; 
            gap: 10px; 
        }
        
        /* Стакан на всю ширину */
        .canvas-container { 
            width: 100%; 
            height: calc(100vh - 240px);
            max-height: calc(100vh - 240px);
            aspect-ratio: auto;
            border-radius: 16px;
        }
        
        #tetris { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
        
        /* Панель кнопок внизу */
        .controls-container { 
            width: 100%; 
            max-width: 450px; 
            height: 220px;
            background: #1c1c24; 
            border: 2px solid #2d2d3d;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            padding: 12px; 
            gap: 12px;
        }
        
        /* Горизонтальное меню кнопок */
        .top-menu { 
            flex-direction: row; 
            gap: 8px; 
            align-items: center; 
        }
        .iksweb { 
            font-size: 11px; 
            padding: 10px 2px; 
            border-radius: 10px; 
        }
        .iksweb1 { 
            width: 42px; 
            height: 36px; 
            border-radius: 10px; 
        }
        .iksweb1 img { height: 16px; }
        
        /* Скрываем подсказку для ПК */
        .instructions { display: none; }
        
        /* ПОКАЗЫВАЕМ МОБИЛЬНЫЙ ДЖОЙСТИК */
        .mobile-joystick { 
            display: flex; 
            width: 100%; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 5px; 
        }
        
        /* Крестовина */
        .d-pad { 
            display: grid; 
            grid-template-columns: repeat(3, 48px); 
            grid-template-rows: repeat(3, 48px); 
            background: #191922; 
            border-radius: 50%; 
            padding: 4px; 
            border: 1px solid #252530; 
        }
        .d-btn { 
            background: #282836; 
            border: none; 
            color: #fff; 
            font-size: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            border-radius: 10px; 
            box-shadow: 0 3px 0 #14141a; 
        }
        .d-btn:active { 
            background: #14141a; 
            transform: translateY(2px); 
            box-shadow: none; 
        }
        .d-btn.b-left { grid-column: 1; grid-row: 2; }
        .d-btn.b-down { grid-column: 2; grid-row: 3; }
        .d-btn.b-right { grid-column: 3; grid-row: 2; }
        .d-pad-center { 
            grid-column: 2; 
            grid-row: 2; 
            background: #1e1e28; 
            border-radius: 4px; 
        }

        /* Кнопка поворота */
        .action-pad { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 6px;
        }
        .rotate-btn { 
            width: 75px; 
            height: 75px; 
            background: linear-gradient(135deg, #10b981, #047857);
            border: 1px solid #34d399;
            border-radius: 50%; 
            color: white; 
            font-size: 24px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #064e3b;
        }
        .rotate-btn:active { 
            background: linear-gradient(135deg, #059669, #065f46);
            transform: translateY(3px); 
            box-shadow: none; 
        }
        .action-label { 
            font-size: 10px; 
            color: #64748b; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: bold; 
            text-align: center;
            display: block;
            width: 100%;
        }
        
        /* Мобильная кнопка лидеров */
        .leaderboard-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #btn-leader {
            width: 55px;
            height: 55px;
            background: #282836;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 0 #14141a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 0;
        }
        #btn-leader img {
            height: 22px;
            width: 22px;
            object-fit: contain;
            filter: none !important;
        }
    }

    /* ============================================ */
    /* ГОРИЗОНТАЛЬНЫЕ ТЕЛЕФОНЫ (повёрнутый экран) */
    /* ============================================ */
    @media (max-height: 500px) and (orientation: landscape) {
        .pc-only-leader { display: none !important; }
        
        #yandex-highscore-side { display: block !important; }
        #yandex-highscore-top { display: none !important; }
        
        .game-wrapper {
            flex-direction: row !important;
            padding: 5px !important;
            gap: 10px !important;
        }
        
        .canvas-container {
            height: 95vh !important;
            width: auto !important;
            aspect-ratio: 480 / 900 !important;
        }
        
        .controls-container {
            width: 240px !important;
            height: 95vh !important;
            padding: 10px !important;
        }
        
        .instructions { display: none !important; }
        
        .top-menu {
            flex-direction: row !important;
            flex-wrap: wrap !important;
            gap: 4px !important;
        }
        .iksweb { font-size: 10px !important; padding: 6px 2px !important; }
        .iksweb.start-btn { flex-basis: 100% !important; }
        
        /* Показываем мобильный джойстик */
        .mobile-joystick {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            margin-top: auto !important;
        }
        
        .d-pad {
            display: grid !important;
            grid-template-columns: repeat(3, 38px) !important;
            grid-template-rows: repeat(3, 38px) !important;
        }
        .d-btn {
            width: 38px !important;
            height: 38px !important;
            font-size: 12px !important;
        }
        
        .rotate-btn {
            width: 55px !important;
            height: 55px !important;
            font-size: 18px !important;
        }
        
        .leaderboard-pad {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 4px !important;
        }
        #btn-leader {
            width: 45px !important;
            height: 45px !important;
        }
        #btn-leader img {
            height: 18px !important;
            width: 18px !important;
        }
    }

    /* ============================================ */
    /* ПК (с мышью) — принудительно скрываем мобильный джойстик */
    /* ============================================ */
    @media (pointer: fine) and (min-width: 769px) {
        .mobile-joystick,
        .d-pad,
        .action-pad,
        .rotate-btn,
        .leaderboard-pad,
        #btn-leader,
        #btn-left,
        #btn-right,
        #btn-down,
        #btn-rot {
            display: none !important;
        }
        
        .pc-only-leader {
            display: inline-flex !important;
        }
        
        .instructions {
            display: block !important;
        }
    }

    /* ============================================ */
    /* ПЛАНШЕТЫ (горизонтальные) */
    /* ============================================ */
    @media (min-width: 768px) and (max-width: 1200px) and (orientation: landscape) and (pointer: coarse) {
        .pc-only-leader { display: none !important; }
        
        .game-wrapper {
            flex-direction: row !important;
            padding: 15px !important;
            gap: 20px !important;
        }
        
        .controls-container {
            width: 260px !important;
            height: 90vh !important;
        }
        
        .instructions { display: none !important; }
        
        .mobile-joystick {
            display: flex !important;
            justify-content: space-between !important;
            margin-top: auto !important;
        }
        
        .d-pad {
            display: grid !important;
            grid-template-columns: repeat(3, 48px) !important;
            grid-template-rows: repeat(3, 48px) !important;
        }
        .d-btn {
            width: 48px !important;
            height: 48px !important;
            font-size: 16px !important;
        }
        
        .rotate-btn {
            width: 65px !important;
            height: 65px !important;
            font-size: 22px !important;
        }
        
        .leaderboard-pad {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
        }
        #btn-leader {
            width: 50px !important;
            height: 50px !important;
        }
    }

    /* ОТМЕНЯЕМ ИНВЕРСИЮ ДЛЯ ИКОНОК */
    #mute, button[onclick="mutebtn()"] img {
        filter: none !important;
        background: transparent !important;
    }
    #btn-leader img, .leaderboard-pad img {
        filter: none !important;
        background: transparent !important;
    }
</style>
</head>
<body>
    <script src="./App.js"></script>

    <div class="game-wrapper">
        <!-- Игровой стакан всегда по центру -->
        <div class="canvas-container" style="position: relative; display: flex; flex-direction: column;">
            <!-- НАДПИСЬ РЕКОРДА ДЛЯ ВЕРТИКАЛЬНЫХ МОБИЛОК (НАД СТАКАНОМ) -->
            <div id="yandex-highscore-top" style="display: none; width: 100%; text-align: center; font-size: 14px; color: #34d399; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;">Рекорд: Загрузка...</div>
            
            <canvas id="tetris" width="480" height="900"></canvas>
        </div>

        <!-- Контейнер интерфейса -->
        <div class="controls-container">
            <!-- Верхняя строка кнопок теперь идеально ровная и стильная -->
            <div class="top-menu">
                <button class="iksweb start-btn" onclick="startGame()">Старт</button>
                
                        <button class="iksweb" onclick="
                            if (typeof isGameStarted === 'undefined' || !isGameStarted) {
                                swal({ title: 'Внимание!', text: 'Игра еще не начата. Нажмите кнопку «Старт»!', icon: 'warning', button: 'Понятно' });
                            } else if (typeof isGameOver !== 'undefined' && isGameOver) {
                                swal({ title: 'Игра завершена!', text: 'Эта сессия окончена. Нажмите кнопку «Старт»!', icon: 'info', button: 'Хорошо' });
                            } else { 
                                window.pauseGame(); 
                                // ВЫЗОВ РЕКЛАМЫ ПРИ ПАУЗЕ (Добавьте эту строчку ниже)
                              if (typeof showVKFullscreenAd === 'function') { showVKFullscreenAd(); }
                            }
                        ">Пауза</button>

                
                <button class="iksweb" onclick="
                    if (typeof isGameStarted === 'undefined' || !isGameStarted) {
                        swal({ title: 'Внимание!', text: 'Игра еще не начата. Нажмите кнопку «Старт»!', icon: 'warning', button: 'Понятно' });
                    } else if (typeof isGameOver !== 'undefined' && isGameOver) {
                        swal({ title: 'Игра завершена!', text: 'Эта сессия окончена. Нажмите кнопку «Старт»!', icon: 'info', button: 'Хорошо' });
                    } else { window.resumeGame(); }
                ">Дальше</button>    
                  <!-- КНОПКА ЛИДЕРБОРДА ДЛЯ ПК (Вернули обратно) -->
    <button class="iksweb1 pc-only-leader" onclick="showVKLeaderboard(typeof player !== 'undefined' ? player.score : 0);" title="Таблица лидеров">
        <img src="icons8.png" style="height: 18px;" /></button>            
                
                <button class="iksweb1" onclick="mutebtn()"><img id="mute" src="./mute.png" /></button>
            </div>
            
            <!-- НАДПИСЬ РЕКОРДА ДЛЯ ПК И ГОРИЗОНТАЛЬНЫХ СМАРТФОНОВ (ВНУТРИ ПУЛЬТА) -->
            <div id="yandex-highscore-side" style="width: 100%; text-align: center; font-size: 16px; color: #34d399; margin: 5px 0; text-transform: uppercase; letter-spacing: 1.5px;">Рекорд: Загрузка...</div>
            
            <div class="instructions">Управление на ПК:<br>Клавиши <b>A / D</b> — Влево/Вправо<br>Клавиша <b>W</b> — Поворот фигуры<br>Клавиша <b>S</b> — Быстрый вниз</div>
            
            <!-- КЛАССИЧЕСКИЙ ГЕЙМПАД ДЛЯ СМАРТФОНОВ -->
            <div class="mobile-joystick">
                <!-- Левая сторона: Крестовина движения -->
                <div class="d-pad">
                    <button class="d-btn b-left" id="btn-left">◀</button>
                    <div class="d-pad-center"></div>
                    <button class="d-btn b-right" id="btn-right">▶</button>
                    <button class="d-btn b-down" id="btn-down">▼</button>
                </div>
                    <!-- НОВОЕ МЕСТО: Кнопка таблицы лидеров в выделенной желтой зоне -->
    <div class="leaderboard-pad" style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <button class="iksweb1" onclick="showVKLeaderboard(typeof player !== 'undefined' ? player.score : 0);"
 id="btn-leader" style="width: 55px; height: 55px; background: #282836; border: none; border-radius: 50%; box-shadow: 0 4px 0 #14141a; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 0;">
            <img src="icons8.png" style="height: 22px; width: 22px; object-fit: contain;" />
        </button>
        <span style="font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">Лидеры</span>
    </div>
                
                <!-- Правая сторона: Большая сочная кнопка поворота -->
                <div class="action-pad">
                    <button class="rotate-btn" id="btn-rot">↻</button>
                    <span class="action-label">Поворот</span>
                </div>
            </div>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>

</html>
