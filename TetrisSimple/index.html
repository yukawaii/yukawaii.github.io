<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script src="sweetalert.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Тетрис Black</title>
<link href="https://googleapis.com" rel="stylesheet">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style type="text/css">
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #131316; font-family: 'Russo One', sans-serif; color: #fff; }
    
    .game-wrapper { display: flex; flex-direction: row; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 20px; gap: 30px; }
    
    .canvas-container { display: flex; justify-content: center; align-items: center; background: #000; padding: 6px; border-radius: 20px; height: 94vh; aspect-ratio: 480 / 900; border: 3px solid #2d2d3d; box-shadow: 0 0 35px rgba(0,0,0,0.9); }
    #tetris { width: 100%; height: 100%; object-fit: contain; border-radius: 14px; }

    .controls-container { display: flex; flex-direction: column; gap: 20px; width: 320px; background: #1c1c24; padding: 25px; border-radius: 24px; border: 2px solid #2d2d3d; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .top-menu { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    
    .iksweb { width: 100%; cursor: pointer; font-size: 14px; font-family: 'Russo One', sans-serif; text-transform: uppercase; letter-spacing: 1.5px; padding: 14px; color: #a0aec0; background: rgba(255, 255, 255, 0.03); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); transition: all 0.2s; }
    .iksweb:active { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .iksweb.start-btn { color: #fff; background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    
    .iksweb1 { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; width: 50px; height: 48px; }
    .iksweb1 img { height: 22px; filter: invert(1) opacity(0.7); }
    .instructions { color: #64748b; font-size: 13px; line-height: 1.6; border-top: 1px solid #2d2d3d; padding-top: 20px; }

    .mobile-joystick { display: none; }
    #yandex-highscore-side { display: block; }
    #yandex-highscore-top { display: none; }

    /* ВЕРТИКАЛЬНЫЕ ТЕЛЕФОНЫ */
    @media (max-width: 768px) and (orientation: portrait) {
        .pc-only-leader { display: none !important; }
        #yandex-highscore-side { display: none !important; }
        #yandex-highscore-top { display: block !important; }
        
        .game-wrapper { flex-direction: column; justify-content: space-between; padding: 10px; gap: 10px; }
        .canvas-container { width: 100%; height: calc(100vh - 240px); max-height: calc(100vh - 240px); aspect-ratio: auto; border-radius: 16px; }
        .controls-container { width: 100%; max-width: 450px; height: 220px; padding: 12px; gap: 12px; }
        .top-menu { flex-direction: row; gap: 8px; align-items: center; }
        .iksweb { font-size: 11px; padding: 10px 2px; border-radius: 10px; }
        .iksweb1 { width: 42px; height: 36px; border-radius: 10px; }
        .iksweb1 img { height: 16px; }
        .instructions { display: none; }
        
        .mobile-joystick { display: flex; width: 100%; justify-content: space-between; align-items: center; margin-top: 5px; gap: 10px; }
        
        .d-pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); background: #191922; border-radius: 50%; padding: 4px; border: 1px solid #252530; }
        .d-btn { background: #282836; border: none; color: #fff; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 10px; box-shadow: 0 3px 0 #14141a; width: 100%; height: 100%; }
        .d-btn:active { background: #14141a; transform: translateY(2px); box-shadow: none; }
        .d-btn.b-left { grid-column: 1; grid-row: 2; }
        .d-btn.b-down { grid-column: 2; grid-row: 3; }
        .d-btn.b-right { grid-column: 3; grid-row: 2; }
        .d-pad-center { grid-column: 2; grid-row: 2; background: #1e1e28; border-radius: 4px; }
        
        .leaderboard-pad { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        #btn-leader { width: 55px; height: 55px; background: #282836; border: none; border-radius: 50%; box-shadow: 0 4px 0 #14141a; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 0; }
        #btn-leader img { height: 22px; width: 22px; filter: none !important; }
        .leaderboard-pad span { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        
        .action-pad { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .rotate-btn { width: 75px; height: 75px; background: linear-gradient(135deg, #10b981, #047857); border: 1px solid #34d399; border-radius: 50%; color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 0 #064e3b; }
        .rotate-btn:active { background: linear-gradient(135deg, #059669, #065f46); transform: translateY(3px); box-shadow: none; }
        .action-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-align: center; display: block; width: 100%; }
    }

/* ПК — только если есть мышь И ширина большая */
@media (pointer: fine) and (min-width: 769px) {
    .mobile-joystick,
    .d-pad,
    .action-pad,
    .rotate-btn,
    .leaderboard-pad,
    #btn-leader,
    #btn-left,
    #btn-right,
    #btn-down,
    #btn-rot {
        display: none !important;
    }
    .pc-only-leader {
        display: inline-flex !important;
    }
    .instructions {
        display: block !important;
    }
}

    /* Горизонтальные телефоны и планшеты — мобильный интерфейс */
@media (pointer: coarse) and (min-width: 769px) and (orientation: landscape) {
    /* Мобильный интерфейс уже есть через @media (max-width: 768px) и (orientation: portrait) */
    /* Но для горизонтальных — нужно принудительно показать джойстик */
    .mobile-joystick {
        display: flex !important;
    }
    .pc-only-leader {
        display: none !important;
    }
    .instructions {
        display: none !important;
    }
}
</style>
</head>
<body>
    <div class="game-wrapper">
        <div class="canvas-container" style="position: relative; display: flex; flex-direction: column;">
            <div id="yandex-highscore-top" style="display: none; width: 100%; text-align: center; font-size: 14px; color: #34d399; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;">Рекорд: Загрузка...</div>
            <canvas id="tetris" width="480" height="900"></canvas>
        </div>

        <div class="controls-container">
            <div class="top-menu">
                <button class="iksweb start-btn" onclick="startGame()">СТАРТ</button>
                <button class="iksweb" onclick="if(typeof isGameStarted==='undefined'||!isGameStarted){swal({title:'Внимание!',text:'Игра еще не начата. Нажмите «Старт»!',icon:'warning',button:'Понятно'});}else if(typeof isGameOver!=='undefined'&&isGameOver){swal({title:'Игра завершена!',text:'Нажмите «Старт»!',icon:'info',button:'Хорошо'});}else{window.pauseGame();if(typeof showVKFullscreenAd==='function')showVKFullscreenAd();}">ПАУЗА</button>
                <button class="iksweb" onclick="if(typeof isGameStarted==='undefined'||!isGameStarted){swal({title:'Внимание!',text:'Игра еще не начата. Нажмите «Старт»!',icon:'warning',button:'Понятно'});}else if(typeof isGameOver!=='undefined'&&isGameOver){swal({title:'Игра завершена!',text:'Нажмите «Старт»!',icon:'info',button:'Хорошо'});}else{window.resumeGame();}">ДАЛЬШЕ</button>
                
                <div style="display: flex; flex-direction: row; justify-content: center; gap: 15px;">
                    <button class="iksweb1 pc-only-leader" onclick="showVKLeaderboard(typeof player !== 'undefined' ? player.score : 0);" title="Таблица лидеров"><img src="icons8.png" style="height: 18px;" /></button>
                    <button class="iksweb1" onclick="mutebtn()"><img id="mute" src="./mute.png" /></button>
                    <button class="iksweb1" onclick="inviteFriends()" title="Пригласить друзей"><img src="friends-icon.png" style="height: 18px;" /></button>
                </div>
            </div>
            
            <div id="yandex-highscore-side" style="width: 100%; text-align: center; font-size: 16px; color: #34d399; margin: 5px 0; text-transform: uppercase; letter-spacing: 1.5px;">Рекорд: Загрузка...</div>
            <div class="instructions">Управление на ПК:<br>Клавиши <b>A / D</b> — Влево/Вправо<br>Клавиша <b>W</b> — Поворот<br>Клавиша <b>S</b> — Быстрый вниз</div>
            
            <div class="mobile-joystick">
                <div class="d-pad">
                    <button class="d-btn b-left" id="btn-left">◀</button>
                    <div class="d-pad-center"></div>
                    <button class="d-btn b-right" id="btn-right">▶</button>
                    <button class="d-btn b-down" id="btn-down">▼</button>
                </div>
                <div class="leaderboard-pad">
                    <button id="btn-leader" type="button" style="width:55px;height:55px;background:#282836;border:none;border-radius:50%;box-shadow:0 4px 0 #14141a;display:flex;justify-content:center;align-items:center;cursor:pointer;padding:0;">
                        <img src="icons8.png" style="height:22px;width:22px;object-fit:contain;" />
                    </button>
                    <span>Лидеры</span>
                </div>
                <div class="action-pad">
                    <button class="rotate-btn" id="btn-rot">↻</button>
                    <span class="action-label">Поворот</span>
                </div>
            </div>
        </div>
    </div>
    <script src="tetris.js"></script>
    <script src="App.js"></script>
    <script>
// Принудительная привязка кнопки лидеров на мобилках
document.addEventListener('DOMContentLoaded', function() {
    // Находим кнопку лидеров в мобильном джойстике
    const mobileLeaderBtn = document.getElementById('btn-leader');
    if (mobileLeaderBtn) {
        // Убираем старый onclick, если был
        mobileLeaderBtn.removeAttribute('onclick');
        // Вешаем новый обработчик
        mobileLeaderBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('📱 Нажата мобильная кнопка лидеров');
            if (typeof showVKLeaderboard === 'function') {
                const currentScore = (typeof player !== 'undefined' && player.score) ? player.score : 0;
                showVKLeaderboard(currentScore);
            } else {
                console.error('❌ showVKLeaderboard не определена');
            }
        });
        console.log('🔘 Кнопка лидеров на мобилке привязана');
    }
});
</script>
</body>
</html>
